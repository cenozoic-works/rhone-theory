status:
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Classical.choice", "Quot.sound"]
  scope: "Setting. All quantities are real. For natural numbers M and N, the resizing matrix W(M, N) has rows indexed by counts i in {0, ..., M} and columns by counts j in {0, ..., N}, with entry C(N, j) p^j (1 − p)^(N − j), p = i/M: the next generation of N genes is a binomial sample from the allele frequency i/M of the current M genes. When M = 0, Lean's convention 0/0 = 0 gives p = 0. The ordinary Wright–Fisher matrix wf N is the case M = N. Heterozygosity is het(N, i) = 2 (i/N)(1 − i/N), the expected heterozygosity 2p(1 − p) at frequency p = i/N (het is 0 when N = 0). For a size schedule n : ℕ → ℕ, wfVarExpect n t f is the function of the initial count i in {0, ..., n(0)} giving the expectation of f(X_t), where the chain moves from size n(s) to size n(s + 1) by W(n(s), n(s + 1)) for s = 0, ..., t − 1. The harmonic mean of T reals a(0), ..., a(T − 1) is H(a) = T / Σ_t 1/a(t). (1) wfResize_nonneg: every entry of W(M, N) is nonnegative, for all M and N. (2) wfResize_row_sum: every row of W(M, N) sums to 1, for all M and N, including N = 0. (3) wfResize_self: W(N, N) = wf N. (4) wfVarExpect_const: with the constant schedule n(s) = N, wfVarExpect n t f is the t-fold iterate of the Wright–Fisher expectation operator applied to f, for every t and f. (5) wfResize_expect_het: for any M and N > 0 and every count i, Σ_j W(M, N)(i, j) het(N, j) = (1 − 1/N) het(M, i). (6) wfVarExpect_het: if n(s + 1) > 0 for every s < t (n(0) may be 0), then for every initial count i the expected heterozygosity at time t is Π_{s=0}^{t−1} (1 − 1/n(s + 1)) times het(n(0), i). The factors use the sizes n(1), ..., n(t) reached after each transition; n(0) enters only through the initial heterozygosity. (7) sum_inv_eq_div_harmonicSize: for any T and any reals a, with no hypotheses, Σ_t 1/a(t) = T / H(a). In degenerate cases (T = 0, some a(t) = 0, or Σ_t 1/a(t) = 0) the identity holds through Lean's convention x/0 = 0. In (8) to (11), T is any natural number and a(t) ≥ 1 for every t (the a(t) need not be integers). (8) prod_deficit_le_harmonic: Π_t (1 − 1/a(t)) ≤ (1 − 1/H(a))^T. (9) prod_deficit_eq_harmonic_iff: equality holds in (8) if and only if all a(t) are equal. (10) harmonic_sub_prod_deficit_le: (1 − 1/H(a))^T − Π_t (1 − 1/a(t)) ≤ ((T − 1)/(2T)) (Σ_t 1/a(t))². (11) abs_prod_deficit_sub_harmonic_le: |Π_t (1 − 1/a(t)) − (1 − 1/H(a))^T| ≤ (Σ_t 1/a(t))²/2. For T = 0 both sides of (8) are 1, (9) holds trivially, and both sides of (10) and (11) are 0 (in (10) through x/0 = 0). (12) wfVarExpect_het_le_harmonic: under the hypotheses of (6), the expected heterozygosity at time t is at most (1 − 1/H)^t het(n(0), i), where H is the harmonic mean of n(1), ..., n(t); that is, the fluctuating population keeps no more expected heterozygosity than a population of constant size H. (13)–(16) are a worked example with T = 2 and sizes a = (2, 4): the product (1 − 1/2)(1 − 1/4) equals 3/8; H(a) = 8/3; (1 − 1/H(a))² = 25/64; and 3/8 ≠ 25/64, so the inequality (8) can be strict. Not covered: mutation, selection, or migration; diploid populations with separate counts of individuals and genes; sample heterozygosity with the correction N/(N − 1); random (rather than fixed, deterministic) size schedules; coalescent formulations; and any limit or approximation statement for large sizes (a related limit theorem in the library is not part of this entry)."

fidelity:
  divergences: "1. The model is haploid with N genes, so the per-generation factor is 1 − 1/N; in the diploid formulations of Wright (1931, 1938) and Crow and Kimura (1970) a population of N individuals has 2N genes and the factor is 1 − 1/(2N). 2. Heterozygosity is the population quantity 2p(1 − p) at the current allele frequency, not a sample estimate. 3. The size schedule is fixed and deterministic; random size fluctuations are not covered. 4. In the literature the harmonic mean appears as an approximate effective size, so that Π (1 − 1/N(t)) is approximately (1 − 1/H)^t; the entry instead proves the exact inequality with equality exactly for constant sizes, and explicit second-order bounds on the gap, and gives an example where the inequality is strict. 5. The harmonic-mean comparisons (8) to (11) are stated for real values a(t) ≥ 1, a slight generalization of integer population sizes. 6. sum_inv_eq_div_harmonicSize holds without hypotheses because of Lean's convention x/0 = 0; for positive a(t) and T ≥ 1 it is the usual rearrangement of the definition. 7. All statements are exact; the worked example is an exact rational computation, not a numerical approximation."

