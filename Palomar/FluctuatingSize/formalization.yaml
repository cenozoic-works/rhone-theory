      lean: "Rhone.MarkovChain.wfResize_nonneg"
      module: "Rhone.MarkovChain.FluctuatingSizeHeterozygosity"
      status: "proved"
    - source: "The rows of the resizing matrix sum to one"
      lean: "Rhone.MarkovChain.wfResize_row_sum"
      module: "Rhone.MarkovChain.FluctuatingSizeHeterozygosity"
      status: "proved"
    - source: "Equal sizes give the Wright-Fisher matrix"
      lean: "Rhone.MarkovChain.wfResize_self"
      module: "Rhone.MarkovChain.FluctuatingSizeHeterozygosity"
      status: "proved"
    - source: "A constant schedule gives the iterated Wright-Fisher expectation"
      lean: "Rhone.MarkovChain.wfVarExpect_const"
      module: "Rhone.MarkovChain.FluctuatingSizeHeterozygosity"
      status: "proved"
    - source: "Wright 1931"
      lean: "Rhone.MarkovChain.wfResize_expect_het"
      module: "Rhone.MarkovChain.FluctuatingSizeHeterozygosity"
      status: "adapted"
    - source: "Wright 1938; Crow and Kimura 1970"
      lean: "Rhone.MarkovChain.wfVarExpect_het"
      module: "Rhone.MarkovChain.FluctuatingSizeHeterozygosity"
      status: "adapted"
    - source: "Definition of the harmonic mean, rearranged"
      lean: "Rhone.MarkovChain.sum_inv_eq_div_harmonicSize"
      module: "Rhone.MarkovChain.FluctuatingSizeHeterozygosity"
      status: "proved"
    - source: "The product is at most the harmonic-mean power"
      lean: "Rhone.MarkovChain.prod_deficit_le_harmonic"
      module: "Rhone.MarkovChain.FluctuatingSizeHeterozygosity"
      status: "proved"
    - source: "Equality exactly for constant size"
      lean: "Rhone.MarkovChain.prod_deficit_eq_harmonic_iff"
      module: "Rhone.MarkovChain.FluctuatingSizeHeterozygosity"
      status: "proved"
    - source: "Second-order bound on the gap"
      lean: "Rhone.MarkovChain.harmonic_sub_prod_deficit_le"
      module: "Rhone.MarkovChain.FluctuatingSizeHeterozygosity"
      status: "proved"
    - source: "Absolute second-order bound"
      lean: "Rhone.MarkovChain.abs_prod_deficit_sub_harmonic_le"
      module: "Rhone.MarkovChain.FluctuatingSizeHeterozygosity"
      status: "proved"
    - source: "The harmonic-mean population keeps at least as much heterozygosity"
      lean: "Rhone.MarkovChain.wfVarExpect_het_le_harmonic"
      module: "Rhone.MarkovChain.FluctuatingSizeHeterozygosity"
      status: "proved"
    - source: "Sizes (2, 4), the product is 3/8"
      lean: "Rhone.MarkovChain.prod_deficit_two_four"
      module: "Rhone.MarkovChain.FluctuatingSizeHeterozygosity"
      status: "proved"
    - source: "Sizes (2, 4), the harmonic mean is 8/3"
      lean: "Rhone.MarkovChain.harmonicSize_two_four"
      module: "Rhone.MarkovChain.FluctuatingSizeHeterozygosity"
      status: "proved"
    - source: "Sizes (2, 4), the harmonic-mean power is 25/64"
