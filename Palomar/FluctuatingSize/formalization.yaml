version: "v0.4"

project:
  name: "Heterozygosity of the Wright-Fisher model under fluctuating population size, and the harmonic mean"
  description: "This entry formalizes the Wright–Fisher chain with population sizes that change between generations. A resizing transition matrix from size M to size N is nonnegative with unit row sums and equals the usual Wright–Fisher matrix when M = N. The expected heterozygosity after resizing is multiplied by 1 − 1/N, so after t generations it is the initial heterozygosity multiplied by the product of the factors 1 − 1/n(s). For T values each at least 1, the product of the factors 1 − 1/a(t) is at most the T-th power of 1 − 1/harmonic mean, with equality if and only if all values are equal, and the gap is bounded by explicit second-order expressions; consequently the expected heterozygosity under a fluctuating size schedule is at most that of a constant population of harmonic-mean size. A numerical example with sizes 2 and 4 shows that the product and the power differ."
  authors:
    - "X. Lee"
    - "N. Volkov"
  responsible_maintainers:
    - "X. Lee"
    - "N. Volkov"
  license: "Apache-2.0"

classification:
  arxiv: ["q-bio.PE", "math.PR"]
  msc2020: ["92D10", "60J10", "92D25"]

sources:
  - title: "Size of population and breeding structure in relation to evolution"
    authors: ["Sewall Wright"]
    location: "Science 87:430-431, 1938"
    relationship: adapts
    note: "Supplies the established idea that the entry adapts: under fluctuating population size, the effective number over several generations is the harmonic mean of the sizes. The alignment records this source, with Crow and Kimura (1970), for wfVarExpect_het. The entry replaces the approximate harmonic-mean rule by exact statements: the product of per-generation factors is at most the harmonic-mean power, with equality exactly for constant sizes, and the gap is bounded explicitly."
  - title: "Evolution in Mendelian populations"
    authors: ["Sewall Wright"]
    id: "doi:10.1093/genetics/16.2.97"
    location: "pp. 110-111"
    relationship: adapts
    note: "Supplies the established mathematics of wfResize_expect_het: the decay of heterozygosity by a constant factor per generation under random drift in a population of fixed size (the library cites pp. 110-111). The entry adapts it to a haploid population of N genes, where the factor is 1 − 1/N, and to a generation in which the size changes from M to N."
  - title: "An Introduction to Population Genetics Theory"
    authors: ["James F. Crow", "Motoo Kimura"]
    location: "Harper and Row, New York, 1970"
    relationship: background
    note: "Context: textbook account of the decline of heterozygosity under changing population size and of the harmonic-mean effective number. The alignment records it with Wright (1938) for wfVarExpect_het; no step of the Lean proof is taken from it."
  - title: "Mathematical Population Genetics I: Theoretical Introduction"
    authors: ["Warren J. Ewens"]
    location: "2nd edition, Interdisciplinary Applied Mathematics 27, Springer, New York, 2004"
    relationship: background
    note: "Context: the Wright–Fisher model and the heterozygosity calculations for it. The library module cites secs. 3.2 and 3.7. No step of the Lean proof is attributed to the book."
  - title: "Theoretical Evolutionary Genetics"
    authors: ["Joseph Felsenstein"]
    id: "https://felsenst.github.io/pgbook/pgbook.pdf"
    relationship: adapts
    note: "Supplies a textbook derivation of the harmonic-mean effective size by matching the product of per-generation heterozygosity factors with the power for a constant size. The entry adapts this into the exact comparison prod_deficit_le_harmonic, its equality case, and the two explicit gap bounds, all proved here; the inequality and its equality case rest on the weighted AM–GM inequality from Mathlib, not on an argument from the book."
  - title: "Relationship of Effective to Census Size in Fluctuating Populations"
    authors: ["Steven T. Kalinowski", "Robin S. Waples"]
    id: "doi:10.1046/j.1523-1739.2002.00134.x"
    relationship: background
    note: "Context: the relation between effective and census sizes in fluctuating populations, where the harmonic mean is the usual approximation. Not formalized and not used in the Lean proofs."
  - title: "Descent"
    authors: ["SauersML"]
    type: other
    id: "https://github.com/SauersML/Descent/tree/28bbf4915b40b80e84ec9354e0bf450b0e4c7120"
    location: "Descent/PopGen/LDDecayTheory.lean: harmonicMeanNe, harmonic_mean_reciprocal; Descent/Coalescent/VariableSize.lean: timeChange (files first committed 2026-08-05)"
    license: "Apache-2.0"
    relationship: other
    note: "The harmonic mean of a size history and its reciprocal identity (compare sum_inv_eq_div_harmonicSize), and the coalescent time change for exponential growth. Related; an independent formalization."

