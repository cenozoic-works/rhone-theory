version: "v0.4"

project:
  name: "Tajima's D under Kingman's coalescent: moments of the numerator, the variance estimate, and the expected spectrum"
  description: "This entry formalizes Tajima's D under Kingman's coalescent with infinitely many sites and mutation parameter θ ≥ 0, for sample size n ≥ 2. The joint law of the genealogy and the mutation counts on its branches is a probability measure. The mean of the numerator is 0 and its variance equals c₁ θ + c₂ θ², where c₁ and c₂ are Tajima's coefficients. The covariance of the pairwise-difference statistic with the number of segregating sites and the mean of their product are stated. The variance estimate based on the number of segregating sites is unbiased for that variance. The expected value of the site frequency spectrum at frequency i is θ/i for 1 ≤ i < n, and these values sum to the mean number of segregating sites; the closed-form coefficient of the expected spectrum equals θ/i and equals that mean. D is defined to be 0 when the variance estimate is nonpositive, and as a result it is 0 when there are no segregating sites and for n = 2 and n = 3; D is a measurable function of the sample."
  authors:
    - "X. Lee"
    - "N. Volkov"
  responsible_maintainers:
    - "X. Lee"
    - "N. Volkov"
  license: "Apache-2.0"

classification:
  arxiv: ["q-bio.PE", "math.PR"]
  msc2020: ["92D10", "60J90", "62F03", "62P10"]

sources:
