status:
  scope: "Model. markedKingmanLaw n θ is the joint law of a Kingman genealogy for n sampled sequences and Poisson mutation counts. The genealogy is the partition-valued Kingman chain started from n singletons: while k blocks remain, the holding time is exponential with rate k(k − 1)/2, so each pair of lineages coalesces at rate 1, and then two blocks chosen uniformly merge. A branch segment is a pair (epoch, block) with the block present in that epoch while at least two blocks remain; given the genealogy, the numbers of mutations on the segments are independent and Poisson with mean (θ/2) times the epoch length (infinitely many sites: every mutation is at a new site). Statistics: S is the total number of mutations (segregating sites); π is the sum over segments of 2b(n − b)/(n(n − 1)) times the segment's count, where b is the block size (the mean number of pairwise differences); ξ_i is the number of mutations on segments of block size i; the numerator is π − S/a₁. Coefficients: a₁ = 1 + 1/2 + … + 1/(n − 1), a₂ = 1 + 1/4 + … + 1/(n − 1)², b₁ = (n + 1)/(3(n − 1)), b₂ = 2(n² + n + 3)/(9n(n − 1)), c₁ = b₁ − 1/a₁, c₂ = b₂ − (n + 2)/(a₁ n) + a₂/a₁², e₁ = c₁/a₁, and e₂ = c₂/(a₁² + a₂), all rational. The variance estimate is V(S) = e₁S + e₂S(S − 1) and tajimaD n π S = (π − S/a₁)/√V(S), with Lean's conventions √x = 0 for x ≤ 0 and x/0 = 0. θ is a nonnegative real number. Compared theorems. (1) markedKingmanLaw_probability: for every n and θ the law is a probability measure. (2) markedKingmanTajimaVarianceEstimate_eq and (3) markedKingmanTajimaD_eq: for every n and every sample point, the variance estimate and D computed from the sample are V(S) and (π − S/a₁)/√V(S). (4) tajimaD_of_varianceEstimate_nonpos: for all real π and S and every n, if V(S) ≤ 0 then D = 0. (5) tajimaD_zero_segregating: D = 0 when S = 0. (6) and (7) tajimaD_two and tajimaD_three: for n = 2 and n = 3, D = 0 for all real π and S, because c₁ = c₂ = 0 there and so e₁ = e₂ = 0. (8) measurable_markedKingmanTajimaD: D is a measurable function of the sample point for every n. For n ≥ 2 and every θ ≥ 0, with expectations under markedKingmanLaw n θ: (9) E[π − S/a₁] = 0; (10) E[πS] = θ + (a₁ + (n + 2)/(2n)) θ²; (11) E[(π − θ)(S − θa₁)] = θ + ((n + 2)/(2n)) θ² (θ and θa₁ are the means of π and S, so this is their covariance); (12) E[(π − S/a₁)²] = c₁θ + c₂θ²; (13) Var(π − S/a₁) = c₁θ + c₂θ²; (14) E[V(S)] = c₁θ + c₂θ²; (15) E[V(S)] = Var(π − S/a₁) (unbiasedness). For 1 ≤ i < n and θ ≥ 0: (16) E[ξ_i] = θ/i. For n ≥ 2: (17) the sum of E[ξ_i] over 1 ≤ i ≤ n − 1 equals E[S]. (18) expSfs_eq: for rational θ and 1 ≤ i < n, the closed-form expected-spectrum coefficient (θ/2) times the sum over k from 2 to n − i + 1 of k times 2/(k(k − 1)) times C(n − i − 1, k − 2)/C(n − 1, k − 1) equals θ/i, as an identity of rational numbers. (19) expSfs_eq_integral_markedKingmanSfs: for rational θ ≥ 0 and 1 ≤ i < n, that coefficient equals E[ξ_i]. Not covered: the distribution of D or any approximation to it, critical values or tests, the variance of D itself, finite-sites or recurrent mutation, recombination, population structure, varying population size, and selection."
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Classical.choice", "Quot.sound"]

fidelity:
  divergences: "D is given the value 0 whenever the variance estimate is nonpositive, in particular when there are no segregating sites and for every sample when n = 2 or n = 3; in the sources D is not defined in those cases. The statements are made directly under Kingman's coalescent with time scaled so that each pair of lineages coalesces at rate 1 and mutations falling at rate θ/2 per unit branch length, with infinitely many sites; the mean results are statements about this model, not about a finite Wright–Fisher population. Mutation counts are attached to branch segments between consecutive coalescence events rather than to whole branches, which gives the same law of S, π, and ξ_i. The algebraic spectrum identities (18) and (19) are stated for rational θ, while the probabilistic statements allow every real θ ≥ 0. Tajima's beta approximation to the distribution of D and its use as a test are not formalized."

