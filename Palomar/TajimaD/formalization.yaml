    authors: ["Fumio Tajima"]
    id: "doi:10.1093/genetics/123.3.585"
    relationship: formalizes
    note: "Source of the statistic D and of the established formulas the entry formalizes: the zero mean of the numerator, its variance c₁θ + c₂θ² with the coefficients a₁, a₂, b₁, b₂, c₁, c₂, e₁, and e₂, and the variance estimate e₁S + e₂S(S − 1). The entry proves these as expectations under the marked Kingman coalescent; the conventions that differ are listed under fidelity."
  - title: "Probability Models for DNA Sequence Evolution"
    authors: ["Richard Durrett"]
    id: "doi:10.1007/978-0-387-78168-6"
    relationship: formalizes
    note: "Textbook presentation of the same results that the statements follow, at the locators recorded in the alignment: sec. 2.4.1 and eq. (2.30) for D, its numerator variance, and the variance estimate; eq. (2.25) for the covariance of the pairwise-difference statistic and the number of segregating sites; Theorem 2.1 and eqs. (2.1) to (2.3) for the expected site frequency spectrum."
  - title: "Statistical properties of segregating sites"
    authors: ["Yun-Xin Fu"]
    id: "doi:10.1006/tpbi.1995.1025"
    relationship: formalizes
    note: "Source of the expected site frequency spectrum θ/i, which the entry formalizes as the mean of the number of mutations carried by exactly i of the n sampled sequences."
  - title: "The coalescent"
    authors: ["J. F. C. Kingman"]
    id: "doi:10.1016/0304-4149(82)90011-4"
    relationship: background
    note: "Source of the genealogical model: the Kingman coalescent, encoded here as a partition-valued jump chain with exponential holding times. The entry formalizes no theorem of this paper."
  - title: "Descent"
    authors: ["SauersML"]
    type: other
    id: "https://github.com/SauersML/Descent/tree/28bbf4915b40b80e84ec9354e0bf450b0e4c7120"
    location: "Descent/Coalescent/TajimaVariance.lean: varPairwiseFromTree_eq_tajima; Descent/Coalescent/SegregatingSites.lean: expectedTajimaNumerator_eq_zero; Descent/Coalescent/SiteFrequencySpectrum.lean: expectedSpectrum_eq (files first committed 2026-08-05)"
    license: "Apache-2.0"
    relationship: other
    note: "A separate Lean 4 formalization that states Tajima's variance formula, the zero mean of the numerator of D, and the spectrum θ/i as identities between closed-form definitions; rhone derives them as expectations under the marked Kingman law. Related; an independent formalization. No code or result from it is used here."

