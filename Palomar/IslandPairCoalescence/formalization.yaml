status:
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Classical.choice", "Quot.sound"]
  scope: "Model. For d demes, the state of two labelled lineages is either an ordered pair (a, b) of demes in Fin d or a single absorbing coalesced state. Each lineage moves to each of the other d − 1 demes at rate m/(d − 1), so it leaves its deme at total rate m; two lineages in the same deme coalesce at rate c; the coalesced state has no transitions. The expected time from a state s is defined analytically from the embedded jump chain: it is the sum over n of the n-step jump-chain probabilities of being at each non-coalesced state y, weighted by the mean holding time 1/q(y), where q(y) is the total jump rate out of y. This is the mean total holding time before absorption. Every compared theorem assumes m > 0 and c > 0 where these appear. (1) expectedTime_same: for every d ≥ 2, m > 0, c > 0, and deme a, the expected time from (a, a) equals d/c; it does not depend on m. (2) expectedTime_different: for the same parameters and any demes a ≠ b, the expected time from (a, b) equals d/c + (d − 1)/(2m); here d − 1 is natural-number subtraction cast to a real, which equals the real d − 1 because d ≥ 2. (3) lintegral_timeBefore: for d ≥ 2, m > 0, c > 0, and every state s, including the coalesced state, the integral in the extended non-negative reals of the total time spent before absorption, with respect to the jump-and-hold path measure started at s, equals the closed form: 0 at the coalesced state, d/c at a same-deme pair, and d/c + (d − 1)/(2m) at a different-deme pair. The path measure is the product of the law of the jump chain started at s, on sequences of states, and the law of an independent sequence of unit-rate exponential clocks; the k-th holding time is the k-th clock divided by the jump rate of the k-th state, and time at the coalesced state is not counted. (4) fstFromTimes_between: with fstFromTimes(t_w, t) = (t − t_w)/t, for d ≥ 2, m > 0, c > 0, any deme a, and any demes b ≠ b', the index computed from the expected time at (a, a) and the expected time at (b, b') equals fstBetween d m c = (d − 1)c/(2md + (d − 1)c). (5) fstFromTimes_random: for the same parameters and any deme a, the index computed from the expected time at (a, a) and the average of the expected time over all d² ordered pairs of demes (two lineages placed independently and uniformly at random, so in the same deme with probability 1/d) equals fstRandom d m c = (d − 1)²c/(2md² + (d − 1)²c). (6) fstBetween_diploid and fstRandom_diploid: for d ≥ 2, m > 0, and real N > 0 (not required to be an integer), substituting c = 1/(2N) gives fstBetween = 1/(1 + 4Nm·d/(d − 1)) and fstRandom = 1/(1 + 4Nm·d²/(d − 1)²). These are identities between the closed forms and involve no separate diploid model. (7) fstBetween_strictAntiOn and fstRandom_strictAntiOn: for d ≥ 2 and c > 0, each closed-form index is strictly decreasing in m on the open half-line m > 0. (8) tendsto_fstBetween_zero_right and tendsto_fstRandom_zero_right: for d ≥ 2 and c > 0, each index tends to 1 as m tends to 0 through positive values. (9) tendsto_fstBetween_atTop and tendsto_fstRandom_atTop: for d ≥ 2 and c > 0, each index tends to 0 as m tends to +∞; the hypothesis c > 0 is stated but not needed by the proof. (10) tendsto_fstBetween_demes and tendsto_fstRandom_demes: for m > 0 and c > 0, each closed-form index, as a function of the natural number d, tends to c/(2m + c) as d tends to infinity. These limits are statements about the closed forms; their link to the chain holds for each d ≥ 2 through (4) and (5). (11) tendsto_fstBetween_demes_diploid and tendsto_fstRandom_demes_diploid: for m > 0 and N > 0, with c = 1/(2N), both indices tend to 1/(1 + 4Nm) as d tends to infinity. Degenerate cases: d = 0 and d = 1 are excluded wherever the chain appears; m = 0 and c = 0 are excluded from every compared statement, so nothing is said about isolated demes or about a model without coalescence. The ordered pairs (a, b) and (b, a) are distinct states with the same expected time. Not covered: samples of more than two lineages; the distribution, variance, or Laplace transform of the coalescence time; asymmetric migration, unequal deme sizes, and stepping-stone or other spatial structure; the discrete-time Wright–Fisher island model and any convergence from it to the continuous-time chain; mutation and heterozygosity, so the link between coalescence-time F_ST and heterozygosity-based F_ST is not formalized; estimation of Nm from data; and a process indexed by continuous real time, since the probabilistic statement (3) is about the jump-and-hold path measure."

fidelity:
  divergences: "Time scale: Slatkin's model is in discrete generations and eq. (12) is derived approximately, for small m; here the model is a continuous-time chain with rates m and c, and the formulas are exact for that chain. No discrete-time model, and no limit theorem connecting one to the chain, is formalized. Parametrization: the coalescence rate c is a free positive parameter; the diploid statements substitute c = 1/(2N) and allow any real N > 0. The migration rate m is the total rate at which one lineage moves to another deme, divided evenly among the d − 1 other demes; under conventions in which a migrant may come from or land in its own deme, m must be rescaled before formulas are compared. Index: F_ST is defined from expected coalescence times as (T − T_within)/T; Hudson et al. define it from heterozygosities, and the correspondence through an infinite-sites mutation model is not formalized. Infinite islands: the value 1/(1 + 4Nm) appears only as a limit, as d tends to infinity, of the finite-d closed forms; no infinite-island model is formalized. Sampling: lineages are labelled and the state is an ordered pair of demes; the random-deme design averages over ordered pairs with replacement, so two lineages share a deme with probability exactly 1/d, which matches sampling two genes from the whole collection only when deme sizes are large. Expectation: the expected times in expectedTime_same, expectedTime_different, fstFromTimes_between, and fstFromTimes_random are defined as a series over the embedded jump chain rather than as the expectation of a hitting time of a process indexed by continuous time; lintegral_timeBefore connects them to an explicit jump-and-hold path measure, not to a continuous-time process."

