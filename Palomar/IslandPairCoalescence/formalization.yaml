version: "v0.4"

project:
  name: "Expected coalescence time and coalescence-time F_ST of two lineages in the symmetric island model"
  description: "This entry formalizes the expected coalescence time of two lineages in the symmetric island model with d ≥ 2 demes, migration rate m, and coalescence rate c, modelled as a continuous-time Markov chain on the demes of two labelled lineages with an absorbing coalesced state. The expected time is d/c for two lineages in the same deme and d/c + (d − 1)/(2m) for two lineages in different demes. These values are proved for the expected holding time accumulated by the embedded jump chain before absorption, and the same closed forms are proved for the expected absorption time under an explicit jump-and-hold path measure (the jump chain together with independent exponential holding times). The coalescence-time fixation index F_ST = (T − T_within)/T is derived for a between-deme design and for a random-deme design, with closed forms for diploid populations of size N (c = 1/(2N)). Both indices are strictly decreasing in m, tend to 1 as m tends to 0 from above and to 0 as m tends to infinity, and tend to c/(2m + c), or 1/(1 + 4Nm) in the diploid case, as the number of demes tends to infinity."
  authors:
    - "X. Lee"
    - "N. Volkov"
  responsible_maintainers:
    - "X. Lee"
    - "N. Volkov"
  license: "Apache-2.0"

