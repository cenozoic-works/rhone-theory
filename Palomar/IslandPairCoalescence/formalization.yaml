sources:
  - title: "Inbreeding coefficients and coalescence times"
    authors: ["Montgomery Slatkin"]
    id: "doi:10.1017/S0016672300029827"
    location: "Sec. 3(i): eqs. (8) and (11), p. 169; eqs. (12)-(14), p. 170"
    relationship: formalizes
    note: "Supplies the established mathematics this entry formalizes: the symmetric island model, the coalescence-time F_ST of eq. (8), the same-deme mean time of sec. 3(i), the different-deme mean time of eq. (12), and the whole-collection index of eqs. (11), (13), and (14). Slatkin works in discrete generations and derives eq. (12) approximately, for small m; expectedTime_different is an exact statement for the continuous-time chain, with a free coalescence rate c in place of 1/(2N). The Lean proof does not follow Slatkin's derivation: it checks that the closed-form times satisfy the first-step (generator) equations of the chain off the coalesced state, and applies a uniqueness theorem for expected costs of a finite chain that is absorbed in a set it reaches from every state (meanTime_eq_expectedTime)."
  - title: "Average number of nucleotide differences in a sample from a single subpopulation: a test for population subdivision"
    authors: ["Curtis Strobeck"]
    location: "Genetics 117(1):149-153, 1987, doi:10.1093/genetics/117.1.149"
    relationship: background
    note: "Context only; no step of any proof comes from it. The paper concerns the mean number of differences between genes sampled from one subpopulation of a subdivided population. It is cited as context for expectedTime_same, whose value d/c does not depend on the migration rate m."
  - title: "The coalescent and the genealogical process in geographically structured population"
    authors: ["M. Notohara"]
    location: "Journal of Mathematical Biology 29(1):59-75, 1990, doi:10.1007/BF00173909"
    relationship: background
    note: "Context only; no step of any proof comes from it. A coalescent for geographically structured populations, cited as context for modelling two lineages as a continuous-time Markov chain in which lineages move between demes and coalesce only within a deme, which is how the chain in this entry is defined."
  - title: "Estimation of levels of gene flow from DNA sequence data"
    authors: ["R. R. Hudson", "M. Slatkin", "W. P. Maddison"]
    id: "doi:10.1093/genetics/132.2.583"
    relationship: adapts
    note: "Cited for the between-population index F_ST = 1 − H_w/H_b (eq. (3)) and the island-model value 1/(1 + 4Nm) (eq. (1)). This entry adapts both: the index is written with expected pair coalescence times in place of heterozygosities (fstFromTimes, applied to the same-deme and different-deme times in fstFromTimes_between), and 1/(1 + 4Nm) appears only as the limit, as the number of demes tends to infinity, of the finite-d indices at c = 1/(2N) (tendsto_fstBetween_demes_diploid and tendsto_fstRandom_demes_diploid). No mutation model linking times to heterozygosities is formalized."
  - title: "A multi-dimensional coalescent process applied to multi-allelic selection models and migration models"
    authors: ["Jody Hey"]
    location: "Theoretical Population Biology 39(1):30-48, 1991, doi:10.1016/0040-5809(91)90039-I"
    relationship: background
    note: "Context only; no step of any proof comes from it. A coalescent on a multi-dimensional state space applied to migration models, cited as context for the state space used here: the ordered pair of demes that hold the two lineages, together with one coalesced state."
  - title: "The coalescent in two colonies with symmetric migration"
    authors: ["H. B. Nath", "R. C. Griffiths"]
    location: "Journal of Mathematical Biology 31(8):841-851, 1993, doi:10.1007/BF00168049"
    relationship: background
    note: "Context only; no step of any proof comes from it. Treats the coalescent for two colonies with symmetric migration, which is the d = 2 case of the model in this entry."
  - title: "Gene identity and genetic differentiation of populations in the finite island model"
    authors: ["Naoyuki Takahata"]
    id: "doi:10.1093/genetics/104.3.497"
    relationship: background
    note: "Context only; no step of any proof comes from it. Treats gene identity and differentiation in the island model with finitely many demes, cited as context for the finite-d forms of F_ST in fstBetween_diploid and fstRandom_diploid."
  - title: "Group selection for a polygenic behavioral trait: estimating the degree of population subdivision"
    authors: ["J. F. Crow", "K. Aoki"]
    id: "doi:10.1073/pnas.81.19.6073"
    relationship: background
    note: "Context only; no step of any proof comes from it. Cited as context for finite-island corrections to the value 1/(1 + 4Nm), of the kind that appears in fstRandom_diploid as the factor d²/(d − 1)²."
  - title: "Descent"
    authors: ["SauersML"]
    type: other
    id: "https://github.com/SauersML/Descent/tree/28bbf4915b40b80e84ec9354e0bf450b0e4c7120"
    location: "Descent/Coalescent/Structured.lean: meanTimeSame_eq_two, fstFromMigration_eq; Descent/Coalescent/StructuredPresentDay.lean: PairwiseCoalescenceTimes.slatkin_identity (files first committed 2026-08-05 and 2026-08-11)"
    license: "Apache-2.0"
    relationship: other
    note: "A Lean 4 repository at the cited commit, listed so that a reader can see an overlapping formalization; it is not a mathematical source of this entry, and nothing from it is imported or used here. At that commit it gives two-deme mean pair coalescence times as closed-form definitions and F_ST = 1/(1 + 2M), which matches the c = 1 case of the limit in tendsto_fstBetween_demes. Related; an independent formalization. No order of priority is stated in either direction."

