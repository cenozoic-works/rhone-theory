version: "v0.4"

project:
  name: "Exact facts about finite and countable models of mutation and drift"
  description: "This entry collects exact facts about finite and countable Markov models of mutation and drift. The characteristic polynomial of the Wright–Fisher transition matrix of size N is the product over k of X minus the eigenvalue indexed by k. For a symmetric nearest-neighbour step on the integers with mutation rate u > 0, no stationary probability distribution exists. For the Moran model with mutation and 0 < u < 1 on N > 0 individuals, the stated law is a probability distribution, the row array is a Markov matrix, and the law is stationary for it."
  authors:
    - "X. Lee"
    - "N. Volkov"
  responsible_maintainers:
    - "X. Lee"
    - "N. Volkov"
  license: "Apache-2.0"

classification:
  arxiv: ["q-bio.PE", "math.PR"]
  msc2020: ["60J10", "92D10", "15A18"]

sources:
  - title: "Diffusion Processes in Genetics"
    authors: ["William Feller"]
    id: "doi:10.1525/9780520411586-018"
    location: "Sec. 8, eq. (8.1), p. 239; Appendix I, eqs. (11.1)-(11.8), p. 244"
    relationship: formalizes
    note: "Supplies the established mathematics for wf_charpoly: the eigenvalues N(N − 1)...(N − k + 1)/N^k, k = 0, ..., N, of the Wright–Fisher transition matrix (sec. 8, eq. (8.1)). The entry formalizes this as a factorization of the characteristic polynomial. The Lean proof shows that the transition matrix, written in the basis of falling factorials, is upper triangular with these eigenvalues on the diagonal (an intertwining with Stirling numbers of the second kind); the library cites Feller's Appendix I, eqs. (11.1)-(11.8), for these factorial-moment identities. This source concerns wf_charpoly only."
  - title: "Random processes in genetics"
    authors: ["P. A. P. Moran"]
    id: "doi:10.1017/s0305004100033193"
    relationship: background
    note: "Context: introduces the Moran model of overlapping generations, the model family of the three Moran statements. The mutation version used here, and its stationary law, are not taken from this paper, and no step of the Lean proofs comes from it."
  - title: "Mathematical Population Genetics I: Theoretical Introduction"
    authors: ["Warren J. Ewens"]
    id: "doi:10.1007/978-0-387-21822-9"
    location: "2nd edition, 2004, sec. 3.4"
    relationship: background
    note: "Context for the Moran statements: the library cites sec. 3.4, on the Moran model, for the definitions and statements of the Moran model with mutation. The entry's chain is a specific parametrization (two alleles, symmetric mutation with probability u at each birth, one birth–death event per step), and its stationary law is defined by the birth–death product formula and verified by detailed balance in the Lean proof. The entry does not claim that this exact parametrization or formula appears in the book."
  - title: "A model of mutation appropriate to estimate the number of electrophoretically detectable alleles in a finite population"
    authors: ["Tomoko Ohta", "Motoo Kimura"]
    id: "doi:10.1017/s0016672300012994"
    relationship: background
    note: "Context for integer_stepwise_no_stationary: the stepwise mutation model, in which allelic states lie on the integer line and a mutation moves a state by one step up or down. The Lean kernel is the one-step law of that mutation process for a single lineage. The nonexistence of a stationary probability law is an elementary consequence proved here (a nonnegative harmonic function on the integers is constant, hence not summable to 1); the entry does not attribute this statement to the paper."
  - title: "Wandering distributions and the electrophoretic profile"
    authors: ["P. A. P. Moran"]
    id: "doi:10.1016/0040-5809(75)90049-0"
    relationship: background
    note: "Context for integer_stepwise_no_stationary: the behaviour of allelic-state distributions under stepwise mutation on the unbounded integer line. The entry's statement concerns a single walk and does not formalize any result of this paper; no step of the Lean proof comes from it."

status:
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Classical.choice", "Quot.sound"]
  scope: "All matrices and functions are real-valued. (1) wf_charpoly: for every natural number N, including N = 0, the characteristic polynomial det(X·I − P) of the (N + 1) × (N + 1) Wright–Fisher matrix P, whose (i, j) entry is the binomial probability C(N, j) (i/N)^j (1 − i/N)^(N − j) for counts i, j in {0, ..., N}, equals the product over k = 0, ..., N of (X − λ_k), where λ_k = N(N − 1)...(N − k + 1)/N^k (falling factorial over N^k). Rows index the current count of one allele in a population of N genes with no mutation or selection. Since λ_0 = λ_1 = 1, the eigenvalue 1 has algebraic multiplicity at least 2 when N ≥ 1. In the degenerate case N = 0, Lean's convention 0/0 = 0 makes P the 1 × 1 matrix (1), and the product is X − 1 because the empty falling factorial and 0^0 are both 1. The statement concerns the characteristic polynomial, hence eigenvalues with algebraic multiplicity; it says nothing about eigenvectors, diagonalizability, or convergence rates. (2) integer_stepwise_no_stationary: for every real u > 0 there is no function p from the integers to the reals with p(n) ≥ 0 for all n, Σ_n p(n) = 1 (as an unconditional sum, HasSum), and p(n) = (1 − u) p(n) + (u/2) p(n − 1) + (u/2) p(n + 1) for all n. The last condition is the stationarity equation for the walk that stays put with probability 1 − u and moves to each neighbour with probability u/2. No upper bound on u is assumed; for u > 1 the kernel has a negative entry and is not a Markov kernel, but the statement still holds, since for any u ≠ 0 the condition says p is harmonic. At u = 0 every probability law is stationary, which is why u > 0 is required. (3)–(5) concern the Moran model with mutation: N > 0 genes, two alleles, count i in {0, ..., N} of one allele, and mutation probability u with 0 < u < 1. In one step the count goes up by 1 with probability up(i) = ((1 − u) i + u (N − i)) (N − i)/N², down by 1 with probability down(i) = ((1 − u)(N − i) + u i) i/N², and otherwise stays, which corresponds to one gene chosen uniformly to die and replaced by the offspring of a parent chosen uniformly from all N genes (possibly the one that dies), the offspring's allele switching with probability u. The law μ(i) is w(i)/Σ_j w(j) with w(i) = Π_{k<i} up(k)/down(k + 1). (3) moran_mutation_stationary: for every j, Σ_i μ(i) P(i, j) = μ(j). (4) moran_mutation_probability: μ(i) ≥ 0 for all i and Σ_i μ(i) = 1. (5) moran_mutation_markov: every entry P(i, j) is nonnegative and every row sums to 1. The endpoints u = 0 and u = 1 and the case N = 0 are excluded by hypothesis. Not covered: mutation or selection in the Wright–Fisher statement; eigenvectors of the Wright–Fisher matrix; asymmetric mutation, more than two alleles, or a closed-form expression for the Moran stationary law; uniqueness of the Moran stationary law or convergence to it; any population-level statement about the stepwise mutation model."

fidelity:
  divergences: "1. wf_charpoly states Feller's eigenvalues as a factorization of the characteristic polynomial of the transition matrix; it does not state Feller's accompanying results on eigenvectors or on the diffusion limit. It covers every N ≥ 0, with the N = 0 case resting on Lean's convention 0/0 = 0. 2. integer_stepwise_no_stationary is a statement about a single lazy symmetric walk on the integers, the one-lineage mutation process of the stepwise mutation model, not about allele frequencies in a population as studied by Ohta and Kimura (1973) and Moran (1975). It assumes only u > 0 and so also covers values u > 1 for which the kernel is not stochastic. 3. The Moran statements use one fixed parametrization: discrete time with one birth–death event per step, two alleles, and symmetric mutation with probability u at each birth. The stationary law is defined by the birth–death product formula rather than by a closed-form expression, and only stationarity, normalization, and the Markov property of the rows are stated; the statements are not compared with a specific displayed formula in Ewens (2004), sec. 3.4. 4. All statements are exact identities or exact nonexistence statements over the reals; nothing is numerical."

