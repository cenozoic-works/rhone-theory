version: "v0.4"

project:
  name: "Linked-site block laws of all lengths identify the collapsed mutation-scaled genealogy"
  description: "This entry formalizes an identifiability theorem for three sampled sequences whose sites all share one random three-tip genealogy (complete linkage). A genealogy is a pair of branch lengths (u, v), where u is the height of the cherry and v is the length of the upper internal branch, together with a label in Fin 3 recording which pair of tips forms the cherry. Its law is an arbitrary finite measure that is almost everywhere supported on nonnegative branch lengths. Given the genealogy, sites evolve independently under the K-state equal-rates mutation model with a uniform root distribution and mutation scale k. For K ≥ 2 and k, l ≥ 0, two such measures, with scales k and l, produce the same law of block patterns for every number L of linked sites if and only if their collapsed objects agree. The collapsed object is the push-forward of the measure under (u, v, q) ↦ (k u, k v, q), with the cherry label replaced by a fixed value whenever k v = 0. A second statement shows that, for a genealogy with zero upper branch (a star tree), the block-pattern law does not depend on which cherry label is attached."
  authors:
    - "X. Lee"
    - "N. Volkov"
  responsible_maintainers:
    - "X. Lee"
    - "N. Volkov"
  license: "Apache-2.0"

