version: "v0.4"

project:
  name: "Pair designs with known strata in island models: Laplace gaps and separation of strata"
  description: "This entry formalizes designs that use pairs of lineages whose starting stratum is known, in island models. In the symmetric island model with n + 2 demes, coalescence rate c within a deme, and migration rate q from a deme to each other deme, the two-state pair generator (lineages in the same deme or in different demes) and its coalescence rates are shown to be the projection of the labelled island-pair generator, and the Laplace transforms of the coalescence-time laws from the two strata differ by ck/(k² + k(c + 2(n + 2)q) + 2cq). A pair is then reported through a channel that maps each of K latent types to a probability distribution on reported labels, the two lineages sharing one latent type with weight equal to the Laplace value and having independent types otherwise; the two strata give different reported pair laws if and only if the channel is informative, that is, its rows are not all equal. For two demes with asymmetric migration rates a and b and coalescence rates c and d, the Laplace values satisfy the first-step balance identity (k + a + b)L₁ = bL₀ + aL₂ for the mixed stratum, the mixed-stratum value lies strictly below at least one of the other two, and consequently no single reported pair law agrees with all three strata through an informative channel with at least two latent types."
  authors:
    - "X. Lee"
    - "N. Volkov"
  responsible_maintainers:
    - "X. Lee"
    - "N. Volkov"
  license: "Apache-2.0"

