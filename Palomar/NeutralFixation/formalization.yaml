version: "v0.4"

project:
  name: "Neutral fixation probability in exchangeable (Cannings) models"
  description: "This entry formalizes the neutral fixation probability in exchangeable (Cannings) models with N individuals. For a non-degenerate model, the probability that the allele count started from i copies ever reaches N equals i/N, and the same holds for eventual absorption in the fixed state. The loss probability is 1 − i/N. For a degenerate model started away from the full state the probability of fixation is 0, and an example with N = 2 shows that the fixation probability can differ from the frequency without a reachability hypothesis. For N ≥ 2, non-degeneracy is shown equivalent to positive-probability reachability of the boundary {0, N} by the count chain, and to each of three conditions on the offspring number of a single parent. A general fixation statement is given for chains on {0, ..., N} whose state is mean-preserving in one step and from which the boundary {0, N} is reachable. The Moran model is shown to be non-degenerate with fixation probability i/N."
  authors:
    - "X. Lee"
    - "N. Volkov"
  responsible_maintainers:
    - "X. Lee"
    - "N. Volkov"
  license: "Apache-2.0"

