    authors: ["Chris Cannings"]
    id: "doi:10.2307/1426293"
    relationship: background
    note: "Context for the model: the exchangeable fixed-size haploid reproduction model and the fact that the expected allele count in the next generation equals the current count. The library module documentation cites sec. 3, eqs. (4)–(5), p. 266 for these. The Lean proof does not follow a proof from this paper; mean preservation of the count is proved in the library from the exchangeability axiom."
  - title: "Mathematical Population Genetics I: Theoretical Introduction"
    authors: ["Warren J. Ewens"]
    id: "doi:10.1007/978-0-387-21822-9"
    relationship: background
    note: "Textbook context for the Cannings and Moran models and for the classical statement that a neutral allele fixes with probability equal to its initial frequency; the library module documentation cites secs. 3.3 and 3.4. Background only; no step of the Lean proof is taken from it."
  - title: "Cannings models (chapter 3 of lecture notes)"
    authors: ["Martin Möhle"]
    id: "https://www.math.uni-tuebingen.de/user/moehle/sp_cannings.pdf"
    location: "Cor. 3.2.6, p. 26; Thm 3.2.4, p. 23, footnote 2"
    relationship: adapts
    note: "The established statement that this entry adapts: the fixation probability i/N (and loss probability 1 − i/N) in a Cannings model, and the role of non-degeneracy. Cor. 3.2.6 as printed states q_i = 1 − i/N for all Cannings models and omits the non-degeneracy hypothesis of Thm 3.2.4, without which it fails (nu_1 = 1 identically). The Lean statements include that hypothesis, add the degenerate case and a counterexample, and state the reachability equivalence and the equivalent offspring conditions explicitly. The Lean proof is written for this formalization and is not claimed to follow the notes: it identifies the hitting probability with the unique function that is harmonic off the closed boundary sets {0} and {N} and takes the boundary values 0 and 1 (uniqueness under positive-probability reachability), and it proves reachability for non-degenerate models by an elementary combinatorial argument on subsets of parents."
  - title: "leanamics"
    authors: ["formal-dynamics"]
    type: other
    id: "https://github.com/formal-dynamics/leanamics/tree/ef4b8d60657213d8345512dc46dd461e505398c6"
    location: "moran/Moran/Counts.lean: moranCountKernel_fixation (file first committed 2026-10-18)"
    license: "MIT"
    relationship: other
