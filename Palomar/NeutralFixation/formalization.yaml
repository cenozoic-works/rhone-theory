status:
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Classical.choice", "Quot.sound"]
  scope: "Setting. A Cannings model with N individuals is given by a finite sample space Ω with real weights w ≥ 0 summing to 1 (some weights may be 0) and, for each outcome, an offspring vector ν = (ν_0, ..., ν_{N−1}) of natural numbers summing to N. Exchangeability is the requirement that for every permutation σ of the N parents and every real function f of offspring vectors, the expectation of f(ν ∘ σ) equals the expectation of f(ν). Since ν takes values in a finite set, a finite Ω loses no generality. The count chain is the Markov chain on {0, ..., N} whose transition from i to j has the probability that the first i parents (indices below i) together have j offspring; generations are independent with the same offspring law. Its path law from i is the law, on sequences indexed by ℕ, of the chain started at i at time 0 (built with the Ionescu–Tulcea theorem); probabilities are real numbers (the real part of the measure). Fixation means that some time n ≥ 0 has count N, and loss that some time has count 0; time 0 counts, so the statements are trivial at i = 0 and i = N. A model is non-degenerate if some outcome of positive weight has some parent with offspring number other than 1, that is, if the offspring vector is not almost surely (1, ..., 1). For N ≤ 1 every model is degenerate, because the single parent (if any) always has exactly one offspring, so the statements that assume non-degeneracy are vacuous unless N ≥ 2. The probability that parent k has m offspring is written P(ν_k = m), and the offspring variance of parent k is defined as the expectation of (ν_k − 1)^2; it is the variance because exchangeability and the sum constraint give E ν_k = 1 (that identification is proved in the library but is not a compared statement). Reachability of a set A means that from every state some power of the transition matrix gives positive probability to some state of A; it is positive-probability reachability, not almost-sure hitting.\n\nCompared theorems. (1) fixation_real_of_nonDegenerate: for N > 0, every non-degenerate Cannings model on N individuals, and every initial count i in {0, ..., N}, the probability that the count ever equals N is i/N. (2) fixation_real_eventually_of_nonDegenerate: under the same hypotheses, the probability that the count is equal to N at all times from some time onward is i/N. (3) loss_real_of_nonDegenerate: under the same hypotheses, the probability that the count ever equals 0 is 1 − i/N. (4) fixation_real_of_not_nonDegenerate: for every N, every degenerate Cannings model, and every initial count i ≠ N, the probability that the count ever equals N is 0 (the count chain is then the identity chain). (5) cannings_fixation_ne_freq_without_reaches: there is a Cannings model with N = 2 (on a one-point sample space; in the proof it is the model in which every parent has one offspring) whose fixation probability from count 1 is not 1/2. (6) countChain_reaches_iff: for N ≥ 2 and every Cannings model, the boundary {0, N} is reachable by the count chain from every state if and only if the model is non-degenerate. (7)–(9) nonDegenerate_iff_offspringProb_zero_pos, nonDegenerate_iff_offspringProb_one_lt_one, nonDegenerate_iff_offspringVariance_pos: for every Cannings model and every parent k (so N ≥ 1), the model is non-degenerate if and only if P(ν_k = 0) > 0, if and only if P(ν_k = 1) < 1, and if and only if the expectation of (ν_k − 1)^2 is positive. (10) fixation_real_of_martingale: for N > 0 and any Markov chain on {0, ..., N} given by a stochastic matrix such that the expected next state from every state j equals j, and from which the boundary {0, N} is reachable, the probability of ever reaching N from i is i/N for every i. (11) moranModel_nonDegenerate: for N ≥ 2, the Moran model is non-degenerate. Here the Moran model has Ω = pairs (p, d) of parents with uniform weight 1/N^2; parent p has one extra offspring and parent d has none, so when p = d every parent has exactly one offspring (a null step of probability 1/N). The extra argument 0 < N needed to construct the model is implied by N ≥ 2. (12) moranModel_fixation_real: for N ≥ 2, the Moran fixation probability from i is i/N.\n\nNot covered: fixation times or their moments, the rate of absorption, selection or mutation, models whose population size varies in time, non-exchangeable or diploid models, Wright–Fisher or other instances apart from the Moran model among the compared statements, and diffusion limits. No explicit lower bound on the probability of reaching the boundary within a given number of steps is stated."

fidelity:
  divergences: "Möhle's Cor. 3.2.6, as printed at the cited location, states the fixation probability for all Cannings models; the Lean statements add the non-degeneracy hypothesis of Thm. 3.2.4, without which the corollary fails, and treat the degenerate case separately. The offspring law is represented on a finite sample space with real weights, which is no loss of generality since offspring vectors take finitely many values. The count chain places the allele on the first i parents; by exchangeability the law of the next count does not depend on which i parents carry it (proved in the library, not a compared statement). Reachability is positive-probability reachability from every state, rather than almost-sure absorption as often assumed in textbook statements of the martingale argument; theorem (10) assumes it explicitly. The offspring 'variance' in theorem (9) is defined as the second moment about 1. The Moran model used here selects the reproducing and the dying parent independently and uniformly, so it includes null steps in which they coincide; other presentations exclude them or work in continuous time, which changes time scales but not fixation probabilities. Fixation probabilities are exact real numbers; no numerical approximation is involved."

