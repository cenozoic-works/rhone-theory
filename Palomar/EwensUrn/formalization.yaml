status:
  scope: "Objects. For a field F, θ in F, and a partition p of n with k parts and m_j parts of size j, the Ewens weight is esf(θ, p) = n! θ^k / (θ(θ + 1)...(θ + n - 1) × (product of the parts) × (product over j of m_j!)), with the rising factorial (ascPochhammer) in the denominator. Theorem sum_esf: for every field F of characteristic zero, every θ in F, and every n with θ(θ + 1)...(θ + n - 1) ≠ 0, the weights of all partitions of n sum to 1; for n = 0 the single empty partition has weight 1. Theorem esf_eq_prod: for every field F, every θ, and every partition p of n, esf(θ, p) = n!/(θ(θ + 1)...(θ + n - 1)) × the product over j from 1 to n of (θ/j)^(m_j)/m_j!. No hypothesis is stated: Lean defines division by zero as zero, so the identity holds formally even when the rising factorial or some j or m_j! vanishes in F; its intended reading is in characteristic zero with a nonzero rising factorial. Theorem ewensUrnLaw_apply: for real θ > 0, let the urn law at size 0 be the point mass at the empty partition, and obtain the law at size n + 1 from the law at size n by one urn step: from a partition q of n, add a new part of size 1 with probability θ/(θ + n), or replace one part of size j by a part of size j + 1 with probability j m_j(q)/(θ + n). Then for every n and every partition p of n, the urn law gives p the probability esf(θ, p), as an extended nonnegative real. Theorem esf_conditional_card_real: for real θ > 0 and every partition p of n with k parts, the Ewens weight of p divided by the total Ewens weight of the partitions of n with k parts equals n! / ((product of the parts) × (product of the m_j!) × |s(n, k)|), where |s(n, k)| is the unsigned Stirling number of the first kind; in particular this conditional law does not depend on θ. Theorem esf_deletion_consistent_real: for real θ > 0 and every partition q of n, the sum over partitions p of n + 1 of esf(θ, p) times the probability of obtaining q from p by deleting one of the n + 1 individuals uniformly at random equals esf(θ, q). The deletion probability is the sum, over part sizes j of p whose reduction by one yields q, of j m_j(p)/(n + 1), where reducing a part of size 1 removes it. Not covered: the derivation of the Ewens formula from the Wright–Fisher, Moran, or coalescent model with infinitely many alleles; θ ≤ 0 for the urn, conditional-law, and consistency statements; random partitions of an infinite population and Kingman's representation theorem; and the two-parameter (Pitman–Yor) generalization."
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Classical.choice", "Quot.sound"]

fidelity:
  divergences: "The formula is treated as a family of weights on integer partitions and is not derived from a population-genetic model. sum_esf and esf_eq_prod are stated for θ in an arbitrary field (of characteristic zero, with a nonvanishing rising factorial, for sum_esf), which is more general than the real θ > 0 of the sources; esf_eq_prod holds formally in every field because Lean defines division by zero as zero. The urn, conditional-law, and deletion-consistency statements are for real θ > 0 only. The urn is a Markov chain on integer partitions rather than an urn of labelled balls, and its law is a probability mass function with values in the extended nonnegative reals, compared with the Ewens weight after converting that real number. The deletion probability is written as a transition weight between integer partitions rather than through the deletion of a labelled individual."

