version: "v0.4"

project:
  name: "No formula with denominators of bounded degree, in the total mutation parameter or in rho, for the two-locus sampling recursion"
  description: "This entry formalizes results on the degree of denominators of any closed-form expression for the solution of the two-locus sampling recursion of the coalescent with recombination, with two alleles at each locus and parent-independent mutation. The mutation rates, the recombination rate rho, and the allele frequencies are independent indeterminates, and the recursion is solved over a field of rational functions in them. An expression is built from rational constants, arbitrary coefficients from the coefficient field, the rates, sums, products, and quotients; it is admissible at degree D when every divisor evaluates to a nonzero polynomial of degree at most D in a designated variable (rho, or the total mutation rate theta_A + theta_B). A closure lemma shows that admissible expressions in inputs with bounded denominators have bounded denominators. For the sample of two lineages that carry the same haplotype at both loci, no admissible expression of degree one in rho, and none of degree two in the total mutation rate, equals the value of the solution; variants bound the total degree of the divisors in the three rates instead. For the samples of m lineages typed at locus A only and m typed at locus B only, all of allele 0, for every bound D there is an m ≥ 2 at which no admissible expression of degree D, in the total mutation rate or in rho, equals the value of the solution. Existence and uniqueness of the solutions are also stated in these settings."
  authors:
    - "X. Lee"
    - "N. Volkov"
  responsible_maintainers:
    - "X. Lee"
    - "N. Volkov"
  license: "Apache-2.0"

