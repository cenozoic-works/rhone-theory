version: "v0.4"

project:
  name: "Mean and variance of segregating sites, Watterson's estimator, and pairwise differences under Kingman's coalescent"
  description: "This entry formalizes the mean and variance of three statistics for a sample of size n ≥ 2 under Kingman's coalescent, with time scaled so that each pair of lineages coalesces at rate 1 and with mutations placed on each branch as a Poisson process of rate θ/2 per unit length (infinite sites, so every mutation is a segregating site). The genealogy is Kingman's coalescent on set partitions of the labelled sample, realized as a jump chain with independent exponential holding times, and the mutation counts on its branch segments are conditionally independent Poisson variables given the genealogy. The statistics are the number S of segregating sites, Watterson's estimator S/a₁, and the average number π of pairwise differences. The mean of S is θa₁ and its variance is θa₁ + θ²a₂, where a₁ = Σ_{i=1}^{n−1} 1/i and a₂ = Σ_{i=1}^{n−1} 1/i². Watterson's estimator has mean θ and variance θ/a₁ + θ²a₂/a₁². The mean of π is θ, and its variance is b₁θ + b₂θ² with b₁ = (n + 1)/(3(n − 1)) and b₂ = 2(n² + n + 3)/(9n(n − 1))."
  authors:
    - "X. Lee"
    - "N. Volkov"
  responsible_maintainers:
    - "X. Lee"
    - "N. Volkov"
  license: "Apache-2.0"

