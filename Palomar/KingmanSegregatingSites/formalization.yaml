sources:
  - title: "On the number of segregating sites in genetical models without recombination"
    authors: ["G. A. Watterson"]
    id: "doi:10.1016/0040-5809(75)90020-9"
    relationship: background
    note: "Background: the original derivation of the mean θa₁ and variance θa₁ + θ²a₂ of the number of segregating sites (p. 258, eqs. (1.4a) and (1.5a)), and of the estimator S/a₁. The paper predates the coalescent formulation, so its setting differs from the marked Kingman law used here, and no step of the Lean proofs is taken from its derivation. The formulas are formalized here in the coalescent setting presented in Durrett's book, which is the source recorded as formalized."
  - title: "The coalescent"
    authors: ["J. F. C. Kingman"]
    id: "doi:10.1016/0304-4149(82)90011-4"
    relationship: background
    note: "Background: supplies the model, the coalescent in which each pair of blocks of a partition of the sample merges at rate 1 (sec. 1). The genealogy in this entry is that process on set partitions of a labelled sample of size n, started from singletons. No result of this paper is restated, and no step of a proof is taken from it beyond the definition of the model."
  - title: "Statistical method for testing the neutral mutation hypothesis by DNA polymorphism"
    authors: ["Fumio Tajima"]
    id: "doi:10.1093/genetics/123.3.585"
    relationship: background
    note: "Background and notation: the coefficients a₁, a₂, b₁, and b₂ (p. 585) whose names are used for tajimaA1, tajimaA2, tajimaB1, and tajimaB2, and the moments of S and π that they express. Tajima's D, the test statistic of this paper, is not part of this entry."
  - title: "Evolutionary relationship of DNA sequences in finite populations"
    authors: ["Fumio Tajima"]
    id: "doi:10.1093/genetics/105.2.437"
    relationship: background
    note: "Background: the original derivation of the mean θ and variance b₁θ + b₂θ² of the average number of pairwise differences (eqs. (29)–(30), p. 449). Its setting is a finite population, not the marked Kingman law used here, and no step of the Lean proofs is taken from its derivation. The formulas are formalized here in the coalescent setting presented in Durrett's book."
  - title: "Probability Models for DNA Sequence Evolution"
    authors: ["Richard Durrett"]
    id: "doi:10.1007/978-0-387-78168-6"
    relationship: formalizes
    note: "Second edition (2008). Supplies the established mathematics this entry formalizes, in the coalescent setting used here: the mean and variance of the number of segregating sites (sec. 1.4.1), the mean and variance of Watterson's estimator (Theorem 1.22), and the mean and variance of the average number of pairwise differences (Theorem 1.26 and eq. (1.30)), all for a Poisson process of mutations on the branches of Kingman's coalescent. The Lean proofs condition on the genealogy, use the conditional Poisson moments of the branch counts, and compute the first two moments of the total branch length (2a₁ and 4a₂) and of the pair-weighted branch length from potentials of the partition chain; they are not a transcription of the book's arguments."
  - title: "Descent"
    authors: ["SauersML"]
    type: other
    id: "https://github.com/SauersML/Descent/tree/28bbf4915b40b80e84ec9354e0bf450b0e4c7120"
    location: "Descent/Coalescent/SegregatingSites.lean: wattersonEstimator_unbiased; Descent/Coalescent/SpectrumMoments.lean: varSegregatingSites_eq_totalVariance; Descent/Coalescent/BranchLength.lean: expectedTotalBranchLength_eq_harmonic (files first committed 2026-08-05)"
    license: "Apache-2.0"
    relationship: other
    note: "A Lean 4 repository at the cited commit, listed so that a reader can see an overlapping formalization; it is not a mathematical source of this entry, and nothing from it is imported or used here. At that commit it has the Watterson mean and variance formulas as identities between closed-form definitions; this entry derives them as expectations under the marked Kingman law. Related; an independent formalization. No order of priority is stated in either direction."
  - title: "lean4phylo"
    authors: ["chaoszhang"]
    type: other
    id: "https://github.com/chaoszhang/lean4phylo/tree/565bf6757999ff9f667835b8ca0cf376548545b9"
    location: "Phylo/Stat/CoalescentStats.lean: totalTreeLengthMean_eq, wattersonTheta_unbiased (file first committed 2026-10-08)"
    license: "Apache-2.0"
    relationship: other
    note: "A Lean 4 repository at the cited commit, listed so that a reader can see an overlapping formalization; it is not a mathematical source of this entry, and nothing from it is imported or used here. At that commit it has the mean total tree length 2H_{n−1} and the unbiasedness of Watterson's estimator, at formula level. Related; an independent formalization. No order of priority is stated in either direction."

