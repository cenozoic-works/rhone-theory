status:
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Classical.choice", "Quot.sound"]
  scope: "Model. For n labelled samples, the genealogy is Kingman's coalescent on set partitions of {0, …, n − 1}, started from the partition into singletons, in which each pair of blocks merges at rate 1, so that k blocks merge at total rate k(k − 1)/2. It is realized as a jump-and-hold path measure: the jump chain on partitions together with an independent sequence of unit-rate exponential clocks, the k-th holding time being the k-th clock divided by the current total rate. Given the genealogy, for each epoch k = 0, …, n − 2 and each block B present in that epoch, the number of mutations on that branch segment is Poisson with mean θ/2 times the holding time of the epoch, independently over all pairs (epoch, block); all other index pairs have mean 0. The resulting joint law of genealogy and counts is markedKingmanLaw n θ, for a non-negative real θ. The statistics are S, the total number of mutations, so that every mutation is a segregating site as under infinite sites; Watterson's estimator S/a₁; and π, the sum over branch segments of the mutation count times 2|B|(n − |B|)/(n(n − 1)), which is the average, over the n(n − 1)/2 unordered pairs of samples, of the number of mutations that separate the pair. Here a₁ = Σ_{i=1}^{n−1} 1/i (the harmonic number H_{n−1}), a₂ = Σ_{i=1}^{n−1} 1/i², b₁ = (n + 1)/(3(n − 1)), and b₂ = 2(n² + n + 3)/(9n(n − 1)), each computed as a rational and cast to a real. Each theorem holds for every n ≥ 2 and every θ ≥ 0. (1) markedKingmanSegregating_mean: the expectation of S is θa₁. (2) markedKingmanSegregating_variance: the variance of S is θa₁ + θ²a₂. (3) markedKingmanWatterson_mean: the expectation of S/a₁ is θ, so Watterson's estimator is unbiased. (4) markedKingmanWatterson_variance: the variance of S/a₁ is θ/a₁ + θ²a₂/a₁². (5) markedKingmanPi_mean: the expectation of π is θ. (6) markedKingmanPi_variance: the expectation of (π − θ)² is b₁θ + b₂θ²; by (5) this is the variance of π, although it is stated as an integral of the squared deviation from θ rather than through Mathlib's variance. Conventions: expectations are Bochner integrals, which are 0 for non-integrable functions, and Mathlib's variance is 0 for a function outside L². The library proves the integrability of S, S², π, and π² under the marked law, but those lemmas are not among the compared theorems. For θ > 0 every right-hand side is positive, so no compared statement can hold through the zero convention; for θ = 0 every statistic is almost surely 0 and each formula reduces to 0 = 0. Degenerate cases: samples of size 0 and 1 are excluded. Not covered: the distribution of S or π beyond the first two moments; the covariance of S and π, and Tajima's D; the site frequency spectrum; recombination, changing population size, population structure, and selection; finite-sites mutation models; and the convergence of Wright–Fisher or Moran genealogies to Kingman's coalescent."

fidelity:
  divergences: "Setting: Watterson (1975) and Tajima (1983) derive the formulas in their own population-genetic models (Watterson's paper predates the coalescent, and Tajima's is stated for finite populations); this entry works only with Kingman's coalescent marked by Poisson mutations, as in Durrett's book, and formalizes no finite-population model and no limit from one. Time and mutation scale: time is scaled so that each pair of lineages coalesces at rate 1, and each lineage carries mutations at rate θ/2 per unit time; sources that use other scalings agree after rescaling θ and time. Infinite sites: S is the total number of mutations; there is no sequence or site model, so the identification of mutations with segregating sites is built into the definition. Marks: mutation counts are attached to (epoch, block) branch segments as conditionally independent Poisson variables, which gives the same joint law of segment counts as a Poisson process along the branches, but the positions of mutations within a segment are not modelled. Genealogy: the coalescent is represented by a jump chain with independent exponential holding times, not as a process indexed by continuous time, and the samples are labelled. Variance of π: theorem (6) is stated as the expectation of (π − θ)², which equals the variance because the mean is θ by theorem (5)."

