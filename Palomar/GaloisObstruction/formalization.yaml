version: "v0.4"

project:
  name: "Block determinants of the two-locus sampling recursion: degree, positivity, squarefreeness, coprimality, and Galois groups"
  description: "This entry formalizes algebraic properties of the block determinants E(i, j) of the two-locus sampling recursion, viewed as polynomials in the recombination rate ρ. E(i, j) is the determinant of an explicit (min(i, j) + 1)-square tridiagonal matrix whose entries depend on i, j, the mutation rates θ_A and θ_B, and ρ. Its degree in ρ is min(i, j) under a stated nondegeneracy condition, and it is positive for i, j ≥ 2 with nonnegative parameters. For nonnegative real mutation rates, every root in ρ of E(5, 5) and of E(7, 7) is real and negative. At explicit rational parameters with negative θ_A, E(5, 5) and E(7, 7) are irreducible over the rationals, have 3 and 5 real roots, have Galois groups of orders 120 and 5040 (the full symmetric groups), and have roots that are not expressible by radicals. E(5, 5) and E(7, 7) are irreducible over the field of rational functions in the mutation rate, and their Galois groups over the field of rational functions in two independent mutation rates are the full symmetric groups; a general specialization lemma used for this is also stated. Squarefreeness, and coprimality for distinct index pairs, of the determinants with i, j ≥ 1 are stated over a field of rational functions in two independent mutation rates and over a field of Laurent series in which both mutation rates are large with a ratio that is not rational."
  authors:
    - "X. Lee"
    - "N. Volkov"
  responsible_maintainers:
    - "X. Lee"
    - "N. Volkov"
  license: "Apache-2.0"

