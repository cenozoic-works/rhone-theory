version: "v0.4"

project:
  name: "Classical identities and a limit theorem of selection theory"
  description: "This entry collects classical identities and a limit theorem from selection theory, stated for finite populations. Fisher's fundamental theorem is stated, in Ewens' interpretation, as the equality of the partial change in mean fitness (the change in allele frequencies under selection, weighted by least-squares average effects) with the additive genetic variance divided by mean fitness, for arbitrary genotype frequencies and any number of loci, together with nonnegativity of that change. A grouped covariance decomposition and a multilevel Price equation are stated as identities for arbitrary weights. Hamilton's rule is derived from the least-squares regression of fitness on own and social genotypes, and the existence of the Lande–Arnold gradient, equal to the inverse phenotypic covariance matrix applied to the vector of selection differentials, is stated under a nonsingular phenotypic covariance. Geiringer's theorem is stated as convergence of repeated recombination to the product of the single-locus marginals, under the condition that every pair of loci is separated with positive probability."
  authors:
    - "X. Lee"
    - "N. Volkov"
  responsible_maintainers:
    - "X. Lee"
    - "N. Volkov"
  license: "Apache-2.0"

