version: "v0.4"

project:
  name: "A partition-pair decomposition of the two-locus sampling probability with Ewens marginals"
  description: "This entry formalizes a decomposition of the two-locus sampling probability, under finite-allele parent-independent mutation, in terms of pairs of set partitions of the sample, with Ewens marginals at each locus. A partition-carrying ancestral process with coalescence, mutation, and recombination records, at each locus, which sample members lose their ancestry to the same mutation; the kernel is the probability that it ends with a given pair of partitions. The solution of the two-locus sampling recursion at a fully typed sample is the sum over pairs of partitions of the kernel times the probability that each block receives a single allele consistent with the sample. Summing the kernel over the partition at one locus gives the Ewens partition probability at the other; as the recombination rate tends to infinity the kernel tends to the product of the two Ewens partition probabilities; and with recombination rate 0 the common refinement of the two partitions has the Ewens law with parameter θA + θB. The sampling probability equals the product of its one-locus marginals for all parameter values exactly when at most one lineage is typed at one of the loci (with at least two alleles per locus). A closed form for configurations with two lineages typed at each locus is also stated, together with existence of a solution of the recursion."
  authors:
    - "X. Lee"
    - "N. Volkov"
  responsible_maintainers:
    - "X. Lee"
    - "N. Volkov"
  license: "Apache-2.0"

