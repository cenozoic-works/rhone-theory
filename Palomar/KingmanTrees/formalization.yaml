status:
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Classical.choice", "Quot.sound"]
  scope: "Objects. Leaves are labelled by Fin n (or by an arbitrary finite type L in the last two theorems). A forest is a finite family of nonempty sets of leaves (clades), any two of which are nested or disjoint; its roots are its maximal clades. A merge adds the union of two distinct roots as a new clade. The forest jump matrix sends a forest with k ≥ 2 roots to each of its binomial(k, 2) merges with probability 1/binomial(k, 2), and fixes a forest with at most one root. A ranked labelled history on n leaves is a sequence of n − 1 merges starting from the forest of n singletons; its mass is the product of the jump probabilities along it, and its end is the final forest, a rooted binary tree given as its set of clades. For a function f of forests, historyPayoff F t f is the sum over t-step histories from F of mass times f at the end; started from the singletons with t = n − 1 it is the expectation of f at the final tree under Kingman's coalescent. Two histories have the same ranked shape if a single permutation of the leaves carries every intermediate forest of one onto the corresponding forest of the other, and the same unranked shape if a permutation carries the final tree of one onto the final tree of the other; RankedShape n and UnrankedShape n are the quotients. A labelled topology is a binary hierarchy on Fin n: a set of clades containing all leaves and every singleton, any two nested or disjoint, in which every clade of size at least 2 is the disjoint union of two clades of the hierarchy. Theorems. (1) card_ranked_labelled_history: for n ≥ 1 there are n!(n − 1)!/2^(n−1) ranked labelled histories (natural-number division, which is exact). (2) ranked_labelled_history_mass: for n ≥ 1 every history has mass 2^(n−1)/(n!(n − 1)!), so by (1) the masses form the uniform probability distribution on histories. (3) card_ranked_shape_one, card_ranked_shape_two, card_unranked_shape_one, and card_unranked_shape_two: on one leaf and on two leaves there is exactly one ranked shape and exactly one unranked shape. (4) card_ranked_shape_recurrence: for n ≥ 3, twice the number R(n) of ranked shapes equals Σ_{k=1}^{n−1} binomial(n − 2, k − 1) R(k) R(n − k). (5) card_unranked_shape_recurrence: for n ≥ 2, the number W(n) of unranked shapes equals Σ_{k=1}^{⌊(n−1)/2⌋} W(k) W(n − k), plus W(n/2)(W(n/2) + 1)/2 when n is even (natural-number division, which is exact). (6) kingman_topology_probability_of_clade_factors: for n ≥ 1 and every labelled topology T, the total mass of the histories ending at T is 2^(n−1)/(n! ∏(|C| − 1)), the product over the clades C of T with |C| ≥ 2 (an empty product is 1). (7) root_split_mass: for n ≥ 2 and every set A of leaves with 0 < |A| < n, the total mass of the histories whose final tree has root children exactly A and its complement is 2/((n − 1) binomial(n, |A|)). (8) sample_population_root_probability: for a population of N ≥ 2 leaves and any set S of leaves with |S| ≥ 1, the total mass of the histories in which S meets both children of the root, that is, in which the most recent common ancestor of S is the root, is (|S| − 1)(N + 1)/((|S| + 1)(N − 1)); it is 0 when |S| = 1 and 1 when S is the whole population. (9) tendsto_sample_population_root_probability: for fixed n ≥ 1, taking S to be the leaves with labels less than n in a population of N leaves, the probability in (8) tends to (n − 1)/(n + 1) as N tends to infinity. (10) kingman_colless_expectation: for n ≥ 1, the expectation over histories of the Colless index of the final tree, the sum over internal clades of the difference between the sizes of the larger and smaller child, is n H_{⌊n/2⌋} − 2⌊n/2⌋, with H_m the m-th harmonic number computed as a rational. (11) kingman_sackin_expectation: for n ≥ 1, the expectation of the Sackin index, the sum over leaves of the number of clades that contain the leaf, other than the leaf itself, is 2n(H_n − 1). (12) historyPayoff_roots_eq_partition_stepN: for any finite label type L, any forest F whose roots are the blocks of a set partition π of L, any t ≤ (number of roots of F) − 1, and any real function f of a family of sets, the expectation of f at the roots of the end of a t-step history from F equals Σ_σ P^t(π, σ) f(blocks of σ), where P is the jump matrix of Kingman's partition-valued coalescent on L. (13) sum_jumpMatrix_roots_eq_partitionJump: for the same F and π and every partition σ of L, the total forest-jump probability from F to forests whose roots are the blocks of σ equals P(π, σ); here there is no restriction on the number of roots, and both sides stay put when there is one root. Degenerate cases: n = 0 is excluded from every theorem on Fin n; the n = 1 cases are included in (1), (2), (6), (9), (10), and (11) and are trivial (a single history of mass 1, indices 0, and limit 0). Not covered: branch lengths, holding times, and any continuous-time statement; variances or distributions of the Colless and Sackin indices; the probabilities of ranked or unranked shapes; closed forms or generating functions for R(n) and W(n), and their identification with the Euler zigzag and Wedderburn–Etherington numbers, beyond the recurrences and initial values; the equality of the law of the final labelled tree with the Yule model; other tree models such as the uniform or beta-splitting models; and nonbinary trees."

fidelity:
  divergences: "Shapes: ranked and unranked shapes are defined as relabelling classes of Kingman histories, not as abstract unlabelled trees; the recurrences and initial values determine the classical sequences, but the identification with the Euler zigzag numbers and the Wedderburn–Etherington numbers is not stated. André's recurrence concerns alternating permutations and is applied here with an index shift; Wedderburn's paper is framed around a functional equation, whereas the recurrence is proved here combinatorially for shape classes. Model: the sources state the Colless and Sackin expectations under the Yule model and the topology probabilities under random bifurcation; here every expectation is a finite weighted sum over ranked labelled Kingman histories, and the coincidence of the Kingman and Yule laws on final trees is not formalized. Only the jump chain of Kingman's coalescent is used, with no holding times. Root split: root_split_mass gives the probability of one specified unordered split of the labelled leaves, which may differ in form from the textbook statement it is cited against. Sample root: the population is finite and labelled, the sample is a fixed set of leaves, and the limit is taken along the samples formed by the first n labels as the population size N grows. Colless index: each internal clade contributes the size of its larger child minus that of its smaller child, computed with natural-number subtraction, which equals the absolute difference. Labels: the last two theorems hold for an arbitrary finite label type, the others for Fin n."

