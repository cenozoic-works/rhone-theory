# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: "v0.4"

project:
  name: "Combinatorics and probabilities of Kingman coalescent trees: histories, shapes, topologies, root splits, Colless, and Sackin"
  description: "This entry formalizes combinatorics and probabilities of trees under Kingman's coalescent, through its embedded jump chain, in which each pair of the k current lineages is the next to merge with probability 1/binomial(k, 2). A ranked labelled history on n leaves is a sequence of n − 1 merges starting from n singletons; there are n!(n − 1)!/2^(n−1) of them, and each has probability 2^(n−1)/(n!(n − 1)!). Ranked and unranked tree shapes are defined as classes of histories under relabelling of the leaves; their numbers satisfy André's recurrence for alternating permutations, shifted by one, and the Wedderburn–Etherington recurrence, respectively, with the cases n = 1 and n = 2. The probability of a labelled rooted binary topology T is 2^(n−1)/(n! ∏(|C| − 1)), the product running over the clades C of T with at least two leaves. The probability that the root splits the leaves into a given set A and its complement is 2/((n − 1) binomial(n, |A|)). The probability that a sample S of a population of N leaves has the population root as its most recent common ancestor is (|S| − 1)(N + 1)/((|S| + 1)(N − 1)), which tends to (n − 1)/(n + 1) for a sample of fixed size n as N tends to infinity. The expected Colless and Sackin indices are n H_{⌊n/2⌋} − 2⌊n/2⌋ and 2n(H_n − 1), where H_m is the m-th harmonic number. Finally, the process of roots of the forest histories is identified with the jump chain of Kingman's partition-valued coalescent, for one step and for t steps."
  authors:
    - "X. Lee"
    - "N. Volkov"
  responsible_maintainers:
    - "X. Lee"
    - "N. Volkov"
  license: "Apache-2.0"

classification:
  arxiv: ["q-bio.PE", "math.CO"]
  msc2020: ["92D15", "60J90", "05C05", "05A15"]

sources:
  - title: "The coalescent"
    authors: ["J. F. C. Kingman"]
    id: "doi:10.1016/0304-4149(82)90011-4"
    relationship: background
    note: "Background: supplies the model. Every probability and expectation in this entry is computed from the jump chain of Kingman's coalescent, in which each pair of the k current lineages is the next to merge with probability 1/binomial(k, 2) (the library cites Theorem 1 and eqs. (1.13) and (2.2)). The history counts and masses, the topology probability, the root-split probability, and the expected indices are derived in Lean from these merge probabilities by induction over histories; the proofs do not follow arguments of the paper."
  - title: "Probability Models for DNA Sequence Evolution"
    authors: ["Richard Durrett"]
    id: "doi:10.1007/978-0-387-78168-6"
    relationship: adapts
    note: "Second edition (2008). Cited for two results that this entry adapts: Theorem 1.5, cited for root_split_mass, the probability 2/((n − 1) binomial(n, |A|)) that the root splits the labelled leaves into a given set A and its complement; and Theorem 1.7, cited for tendsto_sample_population_root_probability, the limit (n − 1)/(n + 1), as the population grows, of the probability that a sample of size n and the whole population share their most recent common ancestor. The adaptation is that both are stated for ranked labelled Kingman histories on labelled leaves: a specified labelled split in the first, and an explicit sequence of samples (the first n labels of a population of N) in the second."
  - title: "Counting, grafting and evolving binary trees"
    authors: ["Thomas Wiehe"]
    id: "doi:10.4171/ECR/17-1/20"
    relationship: background
    note: "Context only; no step of any proof comes from it. A paper on counting binary trees, cited as context for the shape quotients RankedShape and UnrankedShape and their recurrences."
  - title: "Sur les permutations alternees"
    authors: ["Desire Andre"]
    location: "Journal de mathematiques pures et appliquees (3) 7:167-184, 1881, section II no. 6, pp. 170-171"
    relationship: adapts
    note: "Supplies the established recurrence 2A(m + 1) = Σ_k binomial(m, k) A(k) A(m − k) for the numbers A of alternating permutations (section II no. 6). card_ranked_shape_recurrence adapts it to ranked shapes, with the index shifted so that the number of ranked shapes on n leaves plays the role of A(n − 1). The Lean proof does not pass through alternating permutations: it builds an explicit equivalence between ranked shape classes and their decomposition at the root and counts the fibres. The identification of ranked shapes with alternating permutations is not formalized."
  - title: "Increasing trees and alternating permutations"
    authors: ["A. G. Kuznetsov", "I. M. Pak", "A. E. Postnikov"]
    id: "doi:10.1070/RM1994v049n06ABEH002448"
    relationship: background
    note: "Context only; no step of any proof comes from it. Treats the correspondence between increasing trees and alternating permutations, which explains why ranked tree shapes are counted by André's numbers. That correspondence is not formalized here."
  - title: "The probabilities of rooted tree-shapes generated by random bifurcation"
    authors: ["E. F. Harding"]
    id: "doi:10.2307/1426329"
    relationship: background
    note: "Context only; no step of any proof comes from it. Treats the probabilities of rooted tree shapes under random bifurcation, cited as context for kingman_topology_probability_of_clade_factors and the root-split probability. No statement of this paper is restated here."
  - title: "The functional equation g(x^2) = 2 alpha x + [g(x)]^2"
    authors: ["J. H. M. Wedderburn"]
    id: "doi:10.2307/1967710"
    relationship: formalizes
    note: "Supplies the established recurrence for the Wedderburn–Etherington numbers (section 1, p. 122): the number of unranked rooted binary shapes on n leaves is the sum over unordered root splits {k, n − k} with k < n − k of the product of the counts, plus W(n/2)(W(n/2) + 1)/2 when n is even. card_unranked_shape_recurrence formalizes this recurrence for unranked shapes defined as relabelling classes of the final trees of Kingman histories. The Lean proof uses an explicit equivalence between unranked shapes and their root decompositions; it does not use the functional equation of the title."
  - title: "Exact formulas for the variance of several balance indices under the Yule model"
    authors: ["Gabriel Cardona", "Arnau Mir", "Francesc Rossello"]
    id: "doi:10.1007/s00285-012-0615-9"
    location: "Secs. 1 and 7 (arXiv:1202.6573v2)"
    relationship: adapts
    note: "Supplies the established Yule-model expectations of the Colless index (sec. 7) and of the Sackin index (sec. 1) that kingman_colless_expectation and kingman_sackin_expectation adapt. The adaptation is the setting: the expectations here are weighted sums over ranked labelled Kingman histories, not expectations under the Yule model, and the equality of the two laws on final trees is not stated as a theorem. Sec. 1 credits the Sackin mean to Kirkpatrick and Slatkin (1993); sec. 4 credits it to Heard (1992). The Lean proofs work with histories directly, by a recurrence in the size of the root split for the Colless index and through expected leaf depths for the Sackin index; they do not follow the paper's arguments."
  - title: "Patterns in tree balance among cladistic, phenetic, and randomly generated phylogenetic trees"
    authors: ["Stephen B. Heard"]
    id: "doi:10.1111/j.1558-5646.1992.tb01171.x"
    relationship: background
    note: "Context only; no step of any proof comes from it. Cited because Cardona, Mir, and Rosselló credit an earlier account of the expected Sackin index to this paper (their sec. 4); it is context for kingman_sackin_expectation and kingman_colless_expectation."
  - title: "Searching for evolutionary patterns in the shape of a phylogenetic tree"
    authors: ["Mark Kirkpatrick", "Montgomery Slatkin"]
    id: "doi:10.1111/j.1558-5646.1993.tb02144.x"
    relationship: background
    note: "Context only; no step of any proof comes from it. Cited because Cardona, Mir, and Rosselló credit the expected Sackin index under the Yule model to this paper (their sec. 1); it is context for kingman_sackin_expectation."
  - title: "On the genealogy of nested subsamples from a haploid population"
    authors: ["Ian W. Saunders", "Simon Tavare", "G. A. Watterson"]
    id: "doi:10.2307/1427285"
    relationship: formalizes
    note: "Supplies the established formula formalized in sample_population_root_probability: the probability that a sample of size s from a population of N leaves has the same most recent common ancestor as the population is (s − 1)(N + 1)/((s + 1)(N − 1)). Here the population genealogy is the final tree of a ranked labelled Kingman history on N leaves, and the sample is any set S of at least one leaf. The Lean proof counts histories directly and does not follow the paper's argument."
  - title: "Lean 4 formalization of the multispecies coalescent identifiability results of Allman, Degnan and Rhodes (ADR11)"
    authors: ["The-Anh Vu-Le"]
    id: "https://github.com/vltanh/lean4-adr11"
    relationship: adapts
    note: "A Lean 4 project used as a dependency (library citation: commit 2db7f81). Its definitions of forests of clades, roots, merges, the forest jump matrix of Kingman's coalescent, singleton forests, hierarchies, and binary hierarchies are the vocabulary of the compared statements, and the proofs use its lemmas about them. This entry extends that forest construction: historyPayoff_roots_eq_partition_stepN and sum_jumpMatrix_roots_eq_partitionJump identify its process of roots with the jump chain of the partition-valued Kingman coalescent of this library, and the counting and probability results are stated for histories of its forest chain. It is listed among the related formalizations as well."
  - title: "lean4phylo"
    authors: ["chaoszhang"]
    type: other
    id: "https://github.com/chaoszhang/lean4phylo/tree/565bf6757999ff9f667835b8ca0cf376548545b9"
    location: "Phylo/Stat/RankedGeneTree.lean: H_eq_factorial; Phylo/Stat/CoalescentHistoryCount.lean: card_mergeHistories_eq_H (files first committed 2026-10-08); Phylo/Stat/CladeCount.lean: cladeCount_univ (file first committed 2026-10-24)"
    license: "Apache-2.0"
    relationship: other
    note: "A Lean 4 repository at the cited commit, listed so that a reader can see an overlapping formalization; it is not a mathematical source of this entry, and nothing from it is imported or used here. H_eq_factorial and card_mergeHistories_eq_H count ranked labelled histories, n!(n-1)!/2^(n-1): identical to card_ranked_labelled_history. cladeCount_univ counts the histories in which a set is a clade: overlapping with the clade factors of kingman_topology_probability_of_clade_factors. Independent formalization. No order of priority is stated in either direction."

