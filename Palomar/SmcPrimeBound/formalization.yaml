version: "v0.4"

project:
  name: "Total variation bound between an unpruned ancestral recombination process and SMC' on pairwise coalescence times"
  description: "This entry formalizes a total variation bound between the pairwise coalescence-time process of an unpruned ancestral recombination graph and the SMC' approximation, for N ≥ 1 samples, a unit-length genome, and scaled recombination rate R ≥ 0. The observed object is the collection of pairwise coalescence times of all sample pairs at every rational position in [0, 1). The total variation distance is at most an explicit double bound, which is at most min(1, R² times a quadratic coefficient in N − 1). The distance is 0 for one sample and for zero recombination. Supporting statements show that the event kernels of both processes are Markov, the two laws are probability measures, the number of live lineages of the backward process reaches at most one almost surely, the observed coalescence times are almost surely finite, and the expected number of active events, the expected total time, and the expected largest observed coalescence time are bounded by an explicit absorption budget."
  authors:
    - "X. Lee"
    - "N. Volkov"
  responsible_maintainers:
    - "X. Lee"
    - "N. Volkov"
  license: "Apache-2.0"

