sources:
  - title: "Total variation bound between the unpruned ancestral recombination process and the SMC' chain, on pairwise coalescence times"
    type: original-proof
    relationship: other
    note: "The result first presented by this formalization. What is new relative to the cited sources: an explicit analytic upper bound on the total variation distance between the ARG and SMC' laws of the whole field of pairwise coalescence times along a unit genome, valid for every sample size N ≥ 1 and every R ≥ 0 and of order R² for small R, together with the termination and moment statements for the backward process that the bound needs. The established mathematics the entry builds on is the coalescent with recombination (ancestral recombination graph), for which Griffiths and Durrett are listed as background, and the SMC' algorithm of Marjoram and Wall, whose spatial construction the Lean definitions implement. The other listed works study the accuracy of SMC' or SMC-type chains and are context only. No cited source supplies the bound or its proof. Novelty unknown; no claim of priority."
  - title: "Probability Models for DNA Sequence Evolution"
    authors: ["Richard Durrett"]
    location: "2nd edition, Springer, 2008, section 3.4, pp. 102–103, Theorem 3.10"
    relationship: background
    note: "Textbook background on coalescent models with recombination. No step of the Lean proof uses a result from this book."
  - title: "The two-locus ancestral graph"
    authors: ["Robert C. Griffiths"]
    id: "doi:10.1214/lnms/1215459289"
    relationship: background
    note: "Background on the ancestral recombination graph, the backward-in-time model of coalescence with recombination that the entry's backward process represents. No step of the Lean proof uses a result from this paper."
  - title: "Fast \"coalescent\" simulation"
    authors: ["Paul Marjoram", "Jeff D. Wall"]
    id: "doi:10.1186/1471-2156-7-16"
    relationship: background
    note: "Source of the SMC' model. Methods, the SMC' algorithm, steps 1 to 7: the Lean spatial process starts from a coalescent tree at the left end, draws the distance to the next recombination with rate R/2 times the total tree length (matching the rate (ρ/2) L(x) of step 2), cuts the tree at a uniform point, lets the detached lineage reattach at a rate equal to the number of branches present (including its own former branch) and at rate 1 above the root, and regrafts. The paper supplies the model only; it does not state the bound proved here."
  - title: "The SMC' is a highly accurate approximation to the ancestral recombination graph"
    authors: ["Peter R. Wilton", "Shai Carmi", "Asger Hobolth"]
    id: "doi:10.1534/genetics.114.173898"
    relationship: background
    note: "Context for the question the entry answers. Sec. 2.2, eq. (3) and Fig. 5 give the total variation distance between SMC' and the ARG on the two-locus pair (T1, T2) for a sample of size 2, computed numerically; no analytic bound. The entry's bound concerns a different observation (the pairwise coalescence-time field over the whole genome, for any sample size), and its proof uses no result from this paper."
  - title: "Accuracy of the SMC' approximation of structured coalescent"
    authors: ["V. Shchur"]
    id: "doi:10.1134/S1995080222150264"
    relationship: background
    note: "Context only: numerical total variation for the two-locus TMRCA pair, sample of size 2, symmetric two-island model; no analytic bound. The entry treats a single panmictic population and uses no result from this paper."
  - title: "Evaluating the accuracy of sequentially Markov coalescent approximations for structured population models"
    authors: ["A. V. Dudkovskaia", "M. A. Shishkin"]
    id: "doi:10.1134/S1995080225609452"
    relationship: background
    note: "Context only: numerical total-variation curves for structured, bottleneck, and as-SMC' models; no analytic bound. The entry uses no result from this paper."
  - title: "A Markov chain model of coalescence with recombination"
    authors: ["Katy L. Simonsen", "Gary A. Churchill"]
    id: "doi:10.1006/tpbi.1997.1307"
    relationship: background
    note: "Context only: the two-locus ancestral recombination chain for a sample of size 2, credited by Wilton, Carmi, and Hobolth (2015, sec. 2.1) for the n = 2 analysis. The entry uses no result from this paper."
  - title: "Rates of forgetting for the sequentially Markov coalescent"
    authors: ["Jonathan Terhorst"]
    id: "arXiv:2604.20629"
    relationship: background
    note: "Context only: total variation rates of forgetting of the pairwise SMC and SMC' chains along the sequence; not a comparison of the ARG with SMC'. The entry uses no result from this paper."

status:
  scope: "Model. The genome is the unit interval [0, 1). Time is measured so that each pair of lineages coalesces at rate 1, and each lineage recombines at rate R/2 per unit length of the hull of its ancestral material (the smallest interval containing it); a negative R is treated as 0 by the backward process. Backward process (the unpruned ARG): N lineages start at time 0, each carrying [0, 1); every pair of live lineages coalesces at rate 1 whether or not their material overlaps, and the merged lineage keeps all material of both; a recombining lineage is split at a uniform point of its hull into two lineages carrying the material to the left and to the right of the point. Ancestral material is never removed, and the process stops only when at most one lineage is live. It is encoded as a discrete-time Markov chain of events, each step drawing an exponential holding time and the next event from three independent uniform variables. The observation at a rational position q in [0, 1) and a pair (i, j) of samples is the time at which the ancestors of i and j at position q first coincide (0 when i = j, and +∞ if they never do). fullARGLaw N R is the law of this observation, a measure on functions from (position, i, j) to [0, +∞]. SMC' process: the tree at position 0 is a Kingman coalescent tree for N samples, obtained from the same backward process with R = 0; moving to the right, the next recombination point is at an exponential distance with rate (R/2) times the total tree length, the tree is cut at a uniform point on its branches, the detached lineage reattaches at a rate equal to the number of branches present at that height (rate 1 above the root) and to a uniformly chosen one of them, and the tree is regrafted; the process stops at position 1, and immediately if R ≤ 0. smcPrimeLaw N R is the law of the pairwise most-recent-common-ancestor times of the tree in force at each rational position. Total variation (eventTV) is the supremum over measurable sets A of |P(A) − Q(A)|, so it lies in [0, 1]. Bound functions: with h_j = R/(j + 1 + R) and B_n = 1 − (1 − h_0)···(1 − h_(n−1)), doubleBound R 0 = 0 and doubleBound R (m + 1) = (1 − h_m) doubleBound R m + h_m B_(m+2); quadraticCoefficient 0 = 0 and quadraticCoefficient (m + 1) = quadraticCoefficient m + H_(m+2)/(m + 1), with H_n the n-th harmonic number, so quadraticCoefficient 1 = 3/2. The absorption budget absorptionBudget R N is an explicit finite expression in R and N defined in the Challenge by a recursion (countBudget R ⌈2R⌉ (N − 1)). Compared theorems. (1) eventKernel_isMarkovKernel: for both modes (the unrestricted mode used for the ARG, and a mode in which only lineages with touching hulls coalesce) and every real R, the event kernel is a Markov kernel. (2) spatialKernel_isMarkovKernel: for every N and every real R, the SMC' step kernel is a Markov kernel. (3) fullARG_smcPrime_tv_bound: for N ≥ 1 and R ≥ 0, eventTV(fullARGLaw N R, smcPrimeLaw N R) ≤ doubleBound R (N − 1), and doubleBound R (N − 1) ≤ min(1, R² quadraticCoefficient (N − 1)). (4) fullARG_smcPrime_tv_quadratic: for N ≥ 1 and R ≥ 0, the distance is at most min(1, R² quadraticCoefficient (N − 1)). (5) fullARG_smcPrime_tv_one_sample: for N = 1 and every R ≥ 0, the distance is 0. (6) fullARG_smcPrime_tv_zero_recombination: for N ≥ 1 and R = 0, the distance is 0. (7) and (8) fullARGGenealogyLaw_probability and smcPrimeGenealogyLaw_probability: for every N (including 0) and every real R, both laws are probability measures. (9) eventProcess_liveCount_reaches_one: for every N and R ≥ 0, almost surely there is a step after which at most one lineage is live. (10) eventProcess_active_events_le: for every N and R ≥ 0, the sum over steps k of the probability that at least two lineages are live at step k (the expected number of steps taken while at least two lineages are live) is at most absorptionBudget R N. (11) fullARGGenealogyLaw_ae_finite: for every N and R ≥ 0, almost surely every observed coalescence time, at every rational position and for every pair, is finite. (12) eventProcess_total_time_le: for every N and R ≥ 0, the expected supremum over steps of the elapsed time (the expected time until at most one lineage is live) is at most absorptionBudget R N. (13) fullARGGenealogyLaw_lintegral_iSup_le: for every N and R ≥ 0, the expected supremum over all rational positions and all pairs of the observed coalescence time is at most absorptionBudget R N. The bound theorems exclude N = 0. Not covered: the marginal trees, topologies, or branch lengths beyond the pairwise coalescence times; irrational positions except through the rational ones; agreement of the unpruned process with the pruned (Hudson-type) ARG for these observables; stationarity of SMC' along the genome; lower bounds on the distance; the SMC (as opposed to SMC') approximation; and structured or variable-size populations."
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Classical.choice", "Quot.sound"]

fidelity:
  divergences: "The ARG side is an unpruned backward process: it keeps ancestral material whose most recent common ancestor has already been reached, lets every pair of lineages coalesce whatever their material, and runs until at most one lineage is live; it is not the usual pruned ARG simulated by Hudson-type algorithms, and the agreement of the two for the observed pairwise coalescence times is not formalized. Recombination occurs at rate R/2 per unit length of each lineage's hull, so breakpoints can fall in gaps between ancestral segments (trapped material). The observation is restricted to pairwise coalescence times at rational positions in [0, 1); the bound says nothing directly about the full ARG, marginal tree topologies, or other functionals. The total variation distance is the supremum form without a factor of 2. The SMC' process is the left-to-right construction of Marjoram and Wall started from a Kingman tree at position 0; the bound compares the two laws on the whole unit genome at a given R rather than two loci at a given distance, so it is not directly comparable with the two-locus, two-sample numerical distances of Wilton, Carmi, and Hobolth, Shchur, or Dudkovskaia and Shishkin. The quadratic bound exceeds 1 for large R, hence the minimum with 1. The constants are exact and the bounds are proved for all real R ≥ 0; no numerical computation is involved."

