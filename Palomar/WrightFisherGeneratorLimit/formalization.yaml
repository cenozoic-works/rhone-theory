version: "v0.4"

project:
  name: "The generator limit of the neutral Wright-Fisher chain, with an explicit rate"
  description: "This entry formalizes the neutral Wright–Fisher chain with N individuals and the convergence of its rescaled generator, N times the one-generation change, to the diffusion generator x(1 − x)/2 times the second derivative. The transition probabilities are binomial and form a stochastic matrix. The first four moments of the frequency change have explicit formulas, with the fourth moment bounded by 3/(16 N²) and the absolute third moment by 7/(32 N √N). For f with an L-Lipschitz second derivative on [0, 1], the generator error is at most 7L/(192 √N) at every state, with a diploid version in which the chain size is 2N; for a thrice continuously differentiable f with third derivative bounded by M on [0, 1] it is at most 7M/(192 √N), so the largest error over states tends to 0. Corresponding drift statements are given for haploid mutation–selection, with an explicit error bound 2σ(ν + σ)/N and limit (1 − x)(ν − σ x)."
  authors:
    - "X. Lee"
    - "N. Volkov"
  responsible_maintainers:
    - "X. Lee"
    - "N. Volkov"
  license: "Apache-2.0"

classification:
