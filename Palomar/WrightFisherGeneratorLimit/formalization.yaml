  msc2020: ["60J10", "60F17", "92D10", "41A25"]

sources:
  - title: "Markov Processes: Characterization and Convergence"
    authors: ["Stewart N. Ethier", "Thomas G. Kurtz"]
    id: "doi:10.1002/9780470316658"
    relationship: formalizes
    note: "Supplies the established result the entry formalizes: the rescaled Wright–Fisher generator converges to the diffusion generator x(1 − x)/2 times the second derivative (in the chapter on genetic models). The entry formalizes this generator convergence on thrice continuously differentiable functions; the explicit error bounds and moment bounds are not taken from the book, and the book's convergence of the processes themselves is not formalized."
  - title: "Mathematical Population Genetics I: Theoretical Introduction"
    authors: ["Warren J. Ewens"]
    id: "doi:10.1007/978-0-387-21822-9"
    relationship: background
    note: "Textbook account of the Wright–Fisher model and its diffusion approximation, including the mean and variance of the one-generation frequency change and the drift of mutation–selection models, which the alignment cites for those statements. The Lean proofs are self-contained and use no specific result from it."
  - title: "Error estimate for the diffusion approximation of the Wright-Fisher model"
    authors: ["S. N. Ethier", "M. F. Norman"]
    id: "doi:10.1073/pnas.74.11.5096"
    relationship: background
    note: "Context only: an O(1/N) error bound for the diffusion approximation over finite time, under more smoothness. The rhone bound is a one-step generator bound with a slower rate, and its proof uses no result from this paper."
  - title: "Dirichlet approximation of equilibrium distributions in Cannings models with mutation"
    authors: ["H. L. Gan", "A. Röllin", "N. Ross"]
    id: "doi:10.1017/apr.2017.27"
    relationship: background
    note: "Context only: uses moments of the one-generation increment of the same kind as those formalized here, for approximating equilibrium distributions. The entry uses no result from this paper."
  - title: "Descent"
    authors: ["SauersML"]
    type: other
    id: "https://github.com/SauersML/Descent/tree/28bbf4915b40b80e84ec9354e0bf450b0e4c7120"
    location: "Descent/Coalescent/Duality.lean: duality_identity, moment_closure; Descent/Coalescent/BlockMatrixLimit.lean: tendsto_blockOperator_pow (files first committed 2026-08-05)"
    license: "Apache-2.0"
    relationship: other
    note: "A separate Lean 4 formalization containing the Wright–Fisher diffusion generator applied to monomials, written out by hand, and the limit of the Wright–Fisher block-counting chain. It overlaps with the generator statements; an independent formalization. No code or result from it is used here."

