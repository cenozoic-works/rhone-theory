status:
  scope: "Model. For N individuals, wf N is the (N + 1) × (N + 1) matrix whose entry (i, j) is the binomial probability C(N, j) (i/N)^j (1 − i/N)^(N − j) of moving from i to j copies of an allele; wfChain N is the same matrix as a finite Markov chain, and wfDiploid N is wf (2N). The frequency of state i is i/N. The generator error of f at state i is N times (E_i f(X'/N) − f(i/N)) minus (i/N)(1 − i/N)/2 times the second derivative of f at i/N, where X' is the next state; wfGenerator f x = x(1 − x)/2 times the second derivative of f at x. Compared theorems. (1) wf_eq_binomial: the binomial formula for every entry, for every N, including N = 0 under Lean's convention 0/0 = 0. (2) wf_nonneg_and_row_sum: every entry is nonnegative and every row sums to 1. (3) wfChain_expect_eq: the expectation operator of wfChain N is the matrix action. (4) wfDiploid_eq_wf: the diploid chain of size N is the chain with 2N copies. (5) wfChain_generatorError_eq: the general generator-error expression, specialized to this chain, time factor N, and the map i ↦ i/N, is the expression above. (6) hapMutSelStep_eq: the haploid mutation–selection step is μ + (1 − μ) x(1 − s)/(1 − s x) for all real s, μ, and x (an unfolding of the definition, with Lean's convention that division by 0 gives 0). For N ≥ 1 and every state i, with x = i/N and Δ = X'/N − x: (7) E[Δ] = 0; (8) E[Δ²] = x(1 − x)/N; (9) E[Δ³] = x(1 − x)(1 − 2x)/N²; (10) E[Δ⁴] = x(1 − x)(1 + 3(N − 2)x(1 − x))/N³; (11) E[Δ⁴] ≤ 3/(16N²); (12) E|Δ|³ ≤ 7/(32 N √N). (13) wf_generator_error_le: if f has a derivative f' and f' has a derivative f'' within [0, 1] at every point of [0, 1] (one-sided at the ends), and |f''(x) − f''(y)| ≤ L|x − y| on [0, 1], then for N ≥ 1 and every state the error |N(E_i f(X'/N) − f(x)) − x(1 − x)/2 f''(x)| is at most 7L/(192 √N). (14) wfDiploid_generator_error_le: the same with 2N in place of N, giving 7L/(192 √(2N)). (15) wfChain_generatorError_le: if f is thrice continuously differentiable on ℝ and its third derivative is bounded by M in absolute value on [0, 1], the generator error at every state is at most 7M/(192 √N) for N ≥ 1. (16) wf_generatorLimit: for every thrice continuously differentiable f, the supremum over states of the absolute generator error tends to 0 as N → ∞. (17) wf_generator_eventually_le: consequently, for every such f and ε > 0, for all large N the error is at most ε at every state. (18) and (19) sum_binomRow_freq_sub and sum_binomRow_freq_sub_sq: for N ≥ 1 and all real q and x (the binomial weights written as polynomials, so q need not lie in [0, 1]), the sum of the weights times (j/N − x) is q − x, and times (j/N − x)² is q(1 − q)/N + (q − x)². (20) hapMutSel_drift_error_le: with selection s = σ/N and mutation μ = ν/N, for σ ≥ 0, ν ≥ 0, x in [0, 1], N ≥ 1, and N ≥ 2σ, the expected change of frequency after a binomial draw with the mutation–selection step probability, times N, differs from (1 − x)(ν − σx) by at most 2σ(ν + σ)/N. (21) hapMutSel_drift_tendsto: under the same sign and range conditions, that scaled drift tends to (1 − x)(ν − σx) as N → ∞. In this step the allele with frequency x has relative fitness 1 − s and the other allele mutates to it with probability μ. Not covered: convergence of the chains themselves to the Wright–Fisher diffusion (no semigroup, martingale-problem, or weak-convergence statement), the second moment or generator limit of the mutation–selection chain, multi-allele or multi-locus models, and Cannings or Moran models."
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Classical.choice", "Quot.sound"]

fidelity:
  divergences: "Only the generator part of the classical diffusion approximation is formalized: the rescaled one-step generator converges to the diffusion generator on thrice continuously differentiable functions, but no convergence of finite-dimensional distributions, semigroups, or path laws is proved, and no core or closure argument for the full domain of the diffusion generator is given. Time is rescaled by N generations for a haploid chain of size N (by 2N for the diploid version), so the limit generator is x(1 − x)/2 times the second derivative. The explicit rates are the entry's own: the Lipschitz version follows from a second-order Taylor expansion with remainder at most (L/6)|Δ|³ and the bound E|Δ|³ ≤ 7/(32 N √N), giving the rate 1/√N, which is slower than the O(1/N) finite-time bound of Ethier and Norman. The mutation–selection statements concern only the first moment (drift) of a single step, uniformly over x in [0, 1] with N ≥ 2σ; they do not require ν ≤ N, so for small N the step probability can exceed 1, the binomial weights are then not probabilities, and the statements hold as algebraic facts. The polynomial binomial-moment identities (18) and (19) are stated for all real q."

