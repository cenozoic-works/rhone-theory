version: "v0.4"

project:
  name: "When one finite block of linked sites separates a three-sample genealogy from every panmictic history"
  description: "This entry formalizes conditions under which a single finite block of linked sites separates a three-sample genealogy from every panmictic history. A law of the two coalescence-interval lengths and the tree shape of three sampled sequences is uniformly separated at mutation scale k > 0 when some block of L completely linked sites, observed under the equal-rates mutation model, has a law at ℓ1 distance at least a fixed ε > 0 from the block law of every panmictic history (any nonnegative, locally integrable, time-varying coalescence rate with a diverging integrated clock), at every mutation scale and for every alphabet size K ≥ 2. For laws with nonnegative interval lengths, a positive first coalescence time, and a regular first-survival profile matching the first coalescence time, uniform separation holds if and only if the law differs from the panmictic law with the profile's rate, in which the tree shape is uniform and independent of the times; a version for laws of the interval lengths alone, with a uniform independent shape, is also given. For three-sample symmetric island histories with time-varying coalescence and migration rates under the stated integrability hypotheses, uniform separation holds if and only if the history is not the one with all three lineages starting in the same island, no migration, and a diverging integrated coalescence clock. For finite-phase histories, separation is equivalent to failure of a density identity characterizing the panmictic form."
  authors:
    - "X. Lee"
    - "N. Volkov"
  responsible_maintainers:
    - "X. Lee"
    - "N. Volkov"
  license: "Apache-2.0"

