version: "v0.4"

project:
  name: "An upper bound on the denominators of solutions of the two-locus sampling recursion"
  description: "This entry formalizes degree and divisibility facts about the denominators of solutions to the two-locus sampling recursion with two alleles at each locus. Centred moments of a solution, grouped in blocks by the numbers i and j of lineages at the two loci, satisfy a tridiagonal linear system with matrix T(i, j) whose right-hand side involves only smaller blocks. An explicit product D of linear factors in the mutation rates and of block determinants E(p, s) = det T(p, s) clears the denominator of the solution: D times the solution lies in any subring that contains the parameters. Conditionally on D being the reduced denominator of the top centred moment, every denominator of the solution is divisible by E. The determinant E(i, j) has degree min(i, j) in the recombination rate when a nonvanishing condition holds, and is positive when i, j ≥ 2 and the rates are nonnegative. Two statements show that the diagonal determinants E(m, m), with one mutation rate set to zero, have irreducible factors of unbounded degree as m varies, both as polynomials in the mutation rate over rational functions of the recombination rate and as polynomials in the recombination rate over rational functions of the mutation rate."
  authors:
    - "X. Lee"
    - "N. Volkov"
  responsible_maintainers:
    - "X. Lee"
    - "N. Volkov"
  license: "Apache-2.0"

